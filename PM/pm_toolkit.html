<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM Toolkit — Public Management Testing</title>
<style>
  :root {
    --bg:#F7F6F2; --surface:#FFFFFF; --border:#DDD9D0; --border2:#CFCABE;
    --text:#1A1A2E; --muted:#75736B; --muted2:#9A968A;
    --accent:#6A1B9A; --accent2:#4A148C;
    --green:#2E7D32; --red:#C62828; --amber:#B8860B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#17171A; --surface:#212126; --border:#33333A; --border2:#3E3E46;
      --text:#ECECEC; --muted:#9A9A9A; --muted2:#77776F;
      --accent:#C08BE0; --accent2:#D9B3EE;
      --green:#66BB6A; --red:#EF6C6C; --amber:#E0B84D;
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:'Georgia',serif; overflow:hidden; }

  .test-app { display:flex; height:100vh; width:100%; }
  .test-sidebar { width:264px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
                  display:flex; flex-direction:column; }
  .test-sidebar-header { padding:20px 18px 14px; border-bottom:1px solid var(--border); }
  .test-sidebar-logo { font-size:13px; font-weight:bold; letter-spacing:.08em; text-transform:uppercase;
                       color:var(--accent); margin-bottom:3px; }
  .test-sidebar-sub { font-size:11px; color:var(--muted); line-height:1.5; font-style:italic; }
  .subject-switch { display:block; width:100%; margin-top:10px; padding:7px 10px; font-family:'Georgia',serif;
                    font-size:11.5px; font-weight:bold; letter-spacing:.02em; cursor:pointer; text-align:left;
                    border:1px solid var(--border2); border-radius:7px; background:var(--surface);
                    color:var(--muted); transition:all .15s; text-decoration:none; }
  .subject-switch:hover { border-color:var(--accent); color:var(--accent); background:rgba(106,27,154,.06); }
  .test-nav { padding:12px 8px; flex:1; overflow-y:auto; }
  .test-sidebar-footer { padding:8px; border-top:1px solid var(--border); }
  .test-nav-item { display:flex; align-items:flex-start; gap:9px; padding:9px 10px; border-radius:5px; cursor:pointer;
                   font-size:13px; color:var(--muted); transition:all .15s; margin-bottom:1px;
                   border-left:2.5px solid transparent; line-height:1.35; }
  .test-nav-item .nav-label { flex:1; min-width:0; }
  .test-nav-item:hover { background:var(--bg); color:var(--text); }
  .test-nav-item.active { background:var(--bg); color:var(--text); border-left-color:var(--accent); font-weight:bold; }
  .test-nav-item.pool { color:var(--accent); }
  .test-nav-item.pool.active { background:rgba(106,27,154,.08); color:var(--accent); border-left-color:var(--accent); }
  .test-nav-item.exam { color:var(--accent); font-weight:bold; }
  .test-nav-item.exam.active, .test-nav-item.exam:hover { background:rgba(106,27,154,.08); color:var(--accent); }
  .test-nav-icon { font-size:14px; width:18px; text-align:center; flex-shrink:0; }
  .nav-count { flex-shrink:0; font-size:10px; color:var(--muted2); font-family:'Courier New',monospace;
               padding-top:2px; letter-spacing:.02em; }

  .test-main { flex:1; overflow:hidden; display:flex; flex-direction:column; min-width:0; }
  .test-topbar { padding:14px 26px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
  .test-topbar-title { font-size:17px; font-weight:bold; color:var(--accent); margin-bottom:10px; }
  .test-tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .test-tab { border:1px solid var(--border); background:var(--bg); color:var(--muted); font-family:'Georgia',serif;
              font-size:12.5px; font-weight:bold; padding:6px 14px; border-radius:16px; cursor:pointer; }
  .test-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .test-tab .cnt { opacity:.75; font-weight:normal; margin-left:3px; }
  .test-content { flex:1; overflow-y:auto; padding:26px; display:flex; justify-content:center; }
  .test-inner { max-width:730px; width:100%; }
  .test-empty { color:var(--muted); font-style:italic; font-size:13px; padding:30px 0; text-align:center; }

  /* Flashcards */
  .fc-wrap { display:flex; flex-direction:column; align-items:center; gap:16px; }
  .fc-progress { font-size:12px; color:var(--muted2); font-family:'Courier New',monospace; }
  .fc-card { width:100%; min-height:230px; background:var(--surface); border:1px solid var(--border2); border-radius:12px;
             box-shadow:0 3px 14px rgba(0,0,0,.06); padding:30px 34px; display:flex; align-items:center;
             justify-content:center; text-align:center; cursor:pointer; font-size:16px; line-height:1.6; }
  .fc-card.answer { background:var(--bg); font-size:15px; text-align:left; }
  .fc-content { max-width:100%; }
  .fc-hint { font-size:11px; color:var(--muted2); font-style:italic; }
  .fc-topic-tag { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent);
                  font-weight:bold; }
  .fc-controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .fc-btn { border:1px solid var(--border2); background:var(--surface); color:var(--text); font-family:'Georgia',serif;
            font-size:13px; padding:8px 18px; border-radius:6px; cursor:pointer; }
  .fc-btn:hover { background:var(--bg); }
  .fc-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* MCQ */
  .mcq-score { font-size:12px; color:var(--muted); font-family:'Courier New',monospace; margin-bottom:16px;
               padding:8px 14px; background:var(--surface); border:1px solid var(--border); border-radius:7px;
               display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .mcq-score button { border:1px solid var(--border2); background:transparent; color:var(--muted);
                      font-family:'Georgia',serif; font-size:11.5px; padding:4px 12px; border-radius:14px; cursor:pointer; }
  .mcq-score button:hover { border-color:var(--accent); color:var(--accent); }
  .mcq-block { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px 24px; margin-bottom:20px; }
  .mcq-q { font-size:14.5px; line-height:1.55; margin-bottom:14px; }
  .mcq-opt { display:block; width:100%; text-align:left; padding:9px 13px; margin-bottom:7px; border-radius:7px;
             border:1px solid var(--border2); background:var(--bg); color:var(--text); font-family:'Georgia',serif;
             font-size:13.5px; cursor:pointer; line-height:1.45; }
  .mcq-opt:hover { border-color:var(--accent); }
  .mcq-opt.correct { background:rgba(46,125,50,.14); border-color:var(--green); font-weight:bold; }
  .mcq-opt.wrong { background:rgba(198,40,40,.12); border-color:var(--red); }
  .mcq-opt[disabled] { cursor:default; }
  .mcq-rationale { margin-top:10px; font-size:13px; color:var(--muted); line-height:1.6;
                   border-top:1px dashed var(--border); padding-top:10px; display:none; }
  .mcq-rationale.shown { display:block; }

  /* Open questions */
  .oq-block { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px 24px; margin-bottom:22px; }
  .oq-q { font-size:14.5px; line-height:1.6; margin-bottom:14px; }
  .oq-input { width:100%; min-height:150px; box-sizing:border-box; resize:vertical; font-family:'Georgia',serif;
              font-size:13.5px; line-height:1.6; color:var(--text); background:var(--bg);
              border:1px solid var(--border2); border-radius:8px; padding:12px 14px; }
  .oq-input:focus { outline:none; border-color:var(--accent); }
  .oq-copy { margin-top:12px; border:1px solid var(--accent); background:transparent; color:var(--accent);
             font-family:'Georgia',serif; font-size:12.5px; padding:7px 16px; border-radius:20px; cursor:pointer;
             transition:all .15s; }
  .oq-copy:hover { background:var(--accent); color:#fff; }

  /* Mock exam */
  .exam-intro { font-size:13px; color:var(--muted); font-style:italic; line-height:1.6; margin-bottom:22px;
                padding:12px 16px; background:rgba(106,27,154,.06); border-left:3px solid var(--accent); border-radius:4px; }
  .exam-actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; }

  @media (max-width:760px) {
    body { overflow:auto; }
    .test-app { flex-direction:column; height:auto; }
    .test-sidebar { width:100%; border-right:none; border-bottom:1px solid var(--border); }
    .test-nav { max-height:230px; }
    .test-content { padding:18px 14px 40px; }
  }
</style>
</head>
<body>

<div class="test-app">
  <aside class="test-sidebar">
    <div class="test-sidebar-header">
      <div class="test-sidebar-logo">PM Testing</div>
      <div class="test-sidebar-sub">Public Management · UNIBO</div>
      <a class="subject-switch" href="../PE1/pe1_toolkit.html">&rarr; PE1 Toolkit (PE1 &amp; PE3)</a>
    </div>
    <nav class="test-nav" id="nav"></nav>
    <div class="test-sidebar-footer">
      <div class="test-nav-item pool" id="pool-flashcards-nav" onclick="openPool('flashcards')">
        <span class="test-nav-icon">&#127922;</span><span class="nav-label">All flashcards (pooled)</span>
      </div>
      <div class="test-nav-item pool" id="pool-mcq-nav" onclick="openPool('mcq')">
        <span class="test-nav-icon">&#127922;</span><span class="nav-label">All MCQ (pooled)</span>
      </div>
      <div class="test-nav-item pool" id="pool-open-nav" onclick="openPool('open')">
        <span class="test-nav-icon">&#127922;</span><span class="nav-label">All open questions (pooled)</span>
      </div>
      <div class="test-nav-item exam" id="mock-nav" onclick="openMock()">
        <span class="test-nav-icon">&#128221;</span><span class="nav-label">Mock Exam</span>

    </div>
  </aside>

  <div class="test-main">
    <div class="test-topbar">
      <div class="test-topbar-title" id="topic-title">&mdash;</div>
      <div class="test-tabs" id="tabs">
        <button class="test-tab active" data-type="flashcards" onclick="setType('flashcards',this)">&#128451;&#65039; Flashcards</button>
        <button class="test-tab" data-type="mcq" onclick="setType('mcq',this)">&#9745;&#65039; MCQ</button>
        <button class="test-tab" data-type="open" onclick="setType('open',this)">&#9997;&#65039; Open Questions</button>
      </div>
    </div>
    <div class="test-content"><div class="test-inner" id="inner"></div></div>
  </div>
</div>

<script>
const PM_DATA = [
 {
  "key": "foundations",
  "icon": "🏛️",
  "title": "Foundations of Public Management",
  "flashcards": [
   {
    "q": "What are Fayol's five managerial functions?",
    "a": "Planning, organizing, commanding, coordinating, controlling. Fayol treated management as a <b>generalizable discipline</b> resting on principles and functions transversal to all organizations, not on personal traits. He added 14 principles for efficiency and stability (unity of command, unity of direction, scalar chain, division of work, equity, esprit de corps, and so on)."
   },
   {
    "q": "State Taylor's four principles of Scientific Management, and the main criticism.",
    "a": "(1) Science instead of rule of thumb; (2) scientific selection and training of workers; (3) management–worker cooperation; (4) division of work and responsibility. Delivered through <b>time-and-motion studies</b>, standardization and performance-based pay. Criticised for overemphasising control and decreasing job satisfaction. Against Fayol: Taylor is about productivity and its measurable side, Fayol about planning and coordination."
   },
   {
    "q": "What did Weber contribute, and what are his three types of authority?",
    "a": "Bureaucracy as a <b>rational-legal</b> system of authority: rational rules, clear hierarchy, impersonal procedures, division of labour, merit-based employment, structured careers. He was the first to treat organizations as living systems and to make authority and legitimacy core elements of management. The three types are <b>charismatic</b>, <b>traditional</b> and <b>legal-rational</b>. None of them is inherently results-focused, which is exactly why they are distinct from performance management."
   },
   {
    "q": "What are Drucker's five tasks of the manager?",
    "a": "(1) Setting objectives and communicating effectively; (2) organizing and designing a structure to distribute tasks; (3) motivating and communicating; (4) performance measurement through specific metrics; (5) developing people and their skills. Management is \"the art of getting things done through people\", and <b>Management by Objectives (MBO)</b> sets shared goals, translates them into targets and reviews performance against them."
   },
   {
    "q": "Which five criteria distinguish the public case, and what does each mean?",
    "a": "<b>Accountability</b> (answering for actions and decisions), <b>transparency</b> (open and accessible information), <b>economicity</b> (goals reached with optimal use of resources), <b>efficiency</b> (maximum output with minimum resources), <b>effectiveness</b> (extent to which objectives are met)."
   },
   {
    "q": "Lay out the production model of performance and the ratios it defines.",
    "a": "Socio-economic issues create needs; the political system filters them into objectives; inputs are allocated to activities that yield outputs; outputs produce intermediate and then final outcomes.<br><br><b>Economy</b> = monetary input over another input. <b>Efficiency</b> = input over output. <b>Effectiveness</b> = output over outcome. <b>Cost-effectiveness</b> = input over outcome. <b>Relevance</b> = objectives against needs. <b>Utility and sustainability</b> = needs against outcomes."
   },
   {
    "q": "What is the difference between efficiency and productivity in this model, and why is context a problem?",
    "a": "Efficiency is being <i>on</i> the production frontier: an organization is inefficient if a comparable one produces more output with the same input, or the same output with less. Productivity is the <i>slope</i> of input over output (steeper = more productive). <b>Context</b> (socio-economic trends, other governments' policies, EU regulation) heavily shapes final outcomes and lies outside the organization's control, which is what makes outcome-based judgement unfair."
   },
   {
    "q": "What is the Triple Bottom Line?",
    "a": "A UN-developed spectrum of three values for measuring organizational success, meant to bridge the public/private divide: <b>profits</b> (lasting economic impact on society, not just financial gain), <b>people</b> (fair practices toward labour and community), <b>planet</b> (sustainable environmental practices). Private efforts framed around TBL may still be superficial and fail to meet genuine public need."
   },
   {
    "q": "What are Hood's three sets of public values?",
    "a": "(1) Keeping the public sector <b>lean and purposeful</b> — matching resources to tasks; failure is avoidable waste and incompetence. (2) Keeping government <b>fair and honest</b> — preventing distortion, inequity, bias, abuse of office. (3) Keeping the public sector <b>robust and resilient</b> — operating in adverse conditions and adapting in crisis, which is an argument for public over private provision where reliability matters."
   },
   {
    "q": "What are the two ways of relating performance to Hood's values?",
    "a": "Either performance is <b>one value among others</b> (roughly Hood's first set, in tension with the other two), or performance is <b>the realization of public values as a whole</b>, in which case participation and innovation also count as dimensions of performance, not only efficiency and effectiveness."
   },
   {
    "q": "Give Bouckaert and Halligan's three levels of performance.",
    "a": "<b>Macro</b>: countries, supranational entities (EU, OECD), local and regional governments. <b>Meso</b>: a policy sector (education) or a governing chain or network (the food chain, an urban development project). <b>Micro</b>: an individual organization and its interface with citizens and other organizations. In reality the configurations are messy: sectors and networks cut across each other, organizations sit in several at once, and macro performance is itself relative to other countries."
   }
  ],
  "mcq": [
   {
    "q": "Weber's three types of authority are relevant to performance management because:",

     "None of them is inherently focused on results, which is why performance management is distinct from them",
     "Legal-rational authority is a synonym for performance management",

    ],
    "correct": 1,
    "rationale": "None of the three ideal types (charismatic, traditional, legal-rational) is inherently results-focused. That is precisely what separates them from performance management, and why public management in practice is always a blend of ideal types (performance management \"in its pure form\" does not exist)."
   },
   {
    "q": "In the production model, the ratio of input over outcome is:",
    "options": [
     "Efficiency",
     "Economy",
     "Cost-effectiveness",
     "Relevance"
    ],
    "correct": 2,
    "rationale": "Input over **output** is efficiency; input over **outcome** is **cost-effectiveness**. Economy is a monetary input over another input, and relevance confronts objectives with needs."
   },
   {
    "q": "Which statement about efficiency and productivity is correct?",
    "options": [
     "Efficiency is the slope of input over output; productivity is being on the frontier",
     "Efficiency is being on the production frontier; productivity is the slope of input over output",
     "They are two names for the same ratio",
     "Productivity applies only to the private sector"
    ],
    "correct": 1,
    "rationale": "**Efficiency** is a position statement: being on the frontier, so that no comparable organization produces more with the same input. **Productivity** is the slope of input over output, and a steeper slope means more productive."
   },
   {
    "q": "Hood's third set of values (robust and resilient) is often used as an argument for:",
    "options": [
     "Contracting out to specialised private providers",
     "Public rather than private provision where reliability matters",
     "Abolishing performance measurement altogether",
     "Replacing outcome indicators with output indicators"
    ],
    "correct": 1,
    "rationale": "The third set is about operating even in adverse conditions and adapting rapidly in a crisis, with good value meaning strong regimes to fall back on. That is a standard argument for keeping provision public where reliability is the binding requirement."
   },
   {
    "q": "Determining the optimal output level in the public sector should rest on:",

    "correct": 2,
    "rationale": "Public output is harder to define than private output: transaction counts are not a valid proxy, and both the **volume** and the **quality** of services matter. The criterion is societal profit, not financial profit, which makes the calculation much more complex and politically contested."
   },
   {
    "q": "A policy sector such as education, or a chain such as the food chain, sits at which level of performance?",

     "Macro",
     "Meso",
     "Micro",
     "It sits outside the framework"
    ],
    "correct": 1,
    "rationale": "**Meso** covers a policy sector or a governing chain of events and networks. Macro is countries and supranational or regional entities; micro is the single organization and its interface with citizens."
   }
  ],
  "open": [
   {
    "q": "Fayol, Taylor, Weber and Drucker each isolated a different dimension of organized effort. Set out what each contributed, then explain the split between management styles centred on authority and those centred on measurable output and people, and say why that tension keeps reappearing when performance-based reforms meet bureaucratic tradition."

  "title": "Measuring Performance",
  "flashcards": [
   {
    "q": "Distinguish measurement, incorporation and use.",
    "a": "<b>Performance measurement</b> is the bundle of deliberate, intentional activities aimed at systematically collecting data on performance-related issues. <b>Incorporation</b> is importing that data into documents and procedures with the purpose of using it. <b>Use</b> is actually deciding with it. The three are distinct, and an organization can do one without the next."

   {
    "q": "List the five steps of the measurement process.",

   },
   {
    "q": "What is the Mandelbrot coastline paradox, and what does Bouckaert use it for?",
    "a": "The length of the British coastline approaches infinity as measurement resolution increases, because ever more bays and inlets are uncovered. Bouckaert (1993) uses it to show that it is epistemologically impossible to measure everything: each indicator generates new, still-unmeasured questions, so prioritization is unavoidable."
   },
   {
    "q": "What representations of itself does an organization need before it can prioritize measurement?",

   },
   {
    "q": "Give the seven criteria for prioritizing what to measure.",

   {

   },
   {
    "q": "Contrast DEA and Free Disposal Hull.",
    "a": "Both are comparative benchmarking techniques used in norm setting. <b>Data Envelopment Analysis (DEA)</b> assumes a convex efficiency frontier with diminishing returns. <b>Free Disposal Hull (FDH)</b> produces a staircase-shaped frontier and makes no assumption about the shape of the frontier."
   },
   {

    "a": "Few Italian local entities have practised \"virtuous\" strategic planning, in contrast to other European and especially Anglo-Saxon cities where it is habitual. Adoption has mainly been crisis-driven, or motivated by a need to relaunch a territory's vocation, enhance local assets, or seek organizational synergies. <b>Turin</b> is the pioneer case and Emilia-Romagna adopted the practice more recently. A weak organizational culture and a bias toward short-term decisions remain the main obstacles."
   },

   }
  ],

   },
   {

    "options": [
     "Over-involvement, which paralyses decisions",

     "Too many genuinely interested parties"
    ],

  ],
  "open": [
   {
    "q": "Distinguish process sponsors, process champions and process facilitators. Explain what each supplies to the process, give the guidelines for sponsors and champions, and explain the inside/outside trade-off for facilitators."

   {

   },
   {
    "q": "Explain how strategic planning changes when applied to a territory rather than a single organization. Cover the four phases, the six categories of territorial strategic issue, and the articulation from mission through to operational objectives, then assess the Italian record."
   },
   {
    "q": "Define territorial marketing and explain what has intensified territorial competition. Then explain how the internal and external communities relate to each other, and why participative strategic planning suits territorial marketing better than top-down plans."
   },
   {
    "q": "Set out the five phases and three generations of stakeholder engagement, together with the prerequisites for an effective process. Then explain the barriers to participation, why under-involvement rather than over-involvement is the common failure, and connect this to the four reasons strategic planning fails in local government."

/* Minimal markdown for rationale strings: **bold**, *italic*, newlines. */
function mdInline(s){
  if(!s) return s;
  s = s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+?)\*/g,'<em>$1</em>');
  return s.replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
}
function esc(s){ return String(s).replace(/</g,'&lt;'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ── state ───────────────────────────────────────────────────────────────── */
let view = 'topic';          // 'topic' | 'pool' | 'mock'
let topicIdx = 0;
let type = 'flashcards';
let fcIdx = 0, fcAnswer = false;

const answers = {};          // {topicIdx: {qIdx: text}} — typed answers survive navigation
const mcqState = {};          // {"t-<ti>-<qi>": chosen} so results survive re-render

let pool = [], poolIdx = 0;
const poolAnswers = {}, poolMcq = {};
let mock = [];
const mockAnswers = {};

/* ── sidebar ─────────────────────────────────────────────────────────────── */
function initNav(){
  document.getElementById('nav').innerHTML = PM_DATA.map((t,i)=>
    `<div class="test-nav-item${i===0?' active':''}" data-idx="${i}" onclick="setTopic(${i},this)">
       <span class="test-nav-icon">${t.icon}</span>
       <span class="nav-label">${t.title}</span>
       <span class="nav-count" title="flashcards / MCQ / open">${t.flashcards.length}&middot;${t.mcq.length}&middot;${t.open.length}</span>
     </div>`).join('');
}
function clearFooter(){ document.querySelectorAll('.test-sidebar-footer .test-nav-item').forEach(n=>n.classList.remove('active')); }
function clearTopics(){ document.querySelectorAll('#nav .test-nav-item').forEach(n=>n.classList.remove('active')); }

function setTopic(i, el){
  view='topic'; clearFooter();
  document.getElementById('tabs').style.display='';
  topicIdx=i; fcIdx=0; fcAnswer=false;
  clearTopics();
  if(el) el.classList.add('active');
  renderTopic();
}
/* Keeps the tab strip in step with `type`, which a pooled view can change on its
   own. Without this, leaving a pool for a topic showed one tab highlighted and a
   different tab's content. */
function syncTabs(){
  document.querySelectorAll('#tabs .test-tab').forEach(n=>n.classList.toggle('active', n.dataset.type===type));
}
function setType(t, el){
  type=t; fcIdx=0; fcAnswer=false;
  syncTabs();
  if(view==='pool') openPool(t); else renderContent();
}
function renderTopic(){
  const t = PM_DATA[topicIdx];
  document.getElementById('topic-title').textContent = t.icon+' '+t.title;
  document.querySelectorAll('#tabs .test-tab').forEach(tab=>{
    const k = tab.dataset.type, n = (t[k]||[]).length;
    const label = {flashcards:'\u{1F5C3}️ Flashcards', mcq:'☑️ MCQ', open:'✍️ Open Questions'}[k];
    tab.innerHTML = `${label}<span class="cnt">(${n})</span>`;
  });
  renderContent();
}
function renderContent(){
  const t = PM_DATA[topicIdx], inner = document.getElementById('inner');
  const items = t[type] || [];
  if(!items.length){ inner.innerHTML = `<div class="test-empty">Nothing here yet.</div>`; return; }
  if(type==='flashcards') renderFlashcards(inner, items);
  else if(type==='mcq')   renderMCQ(inner, items);
  else                    renderOpen(inner, items);
}

/* ── flashcards ──────────────────────────────────────────────────────────── */
function renderFlashcards(inner, items){
  const c = items[fcIdx];
  inner.innerHTML = `
    <div class="fc-wrap">
      <div class="fc-progress">Card ${fcIdx+1} / ${items.length}</div>
      <div class="fc-card${fcAnswer?' answer':''}" onclick="flipCard()">
        <div class="fc-content">${fcAnswer ? c.a : c.q}</div>
      </div>
      <div class="fc-hint">Click the card (or press Space) to ${fcAnswer?'see the question':'reveal the answer'} &middot; &larr; &rarr; to move</div>
      <div class="fc-controls">
        <button class="fc-btn" onclick="prevCard()">&larr; Prev</button>
        <button class="fc-btn primary" onclick="flipCard()">Flip</button>
        <button class="fc-btn" onclick="nextCard()">Next &rarr;</button>
      </div>
    </div>`;
}
function flipCard(){ fcAnswer=!fcAnswer; renderContent(); }
function nextCard(){ const n=PM_DATA[topicIdx].flashcards.length; fcIdx=(fcIdx+1)%n; fcAnswer=false; renderContent(); }
function prevCard(){ const n=PM_DATA[topicIdx].flashcards.length; fcIdx=(fcIdx-1+n)%n; fcAnswer=false; renderContent(); }

/* ── MCQ ─────────────────────────────────────────────────────────────────── */
function mcqKey(qi){ return 't-'+topicIdx+'-'+qi; }
function renderMCQ(inner, items){
  const answered = items.filter((_,qi)=>mcqState[mcqKey(qi)]!==undefined).length;
  const correct  = items.filter((m,qi)=>mcqState[mcqKey(qi)]===m.correct).length;
  inner.innerHTML = `
    <div class="mcq-score">
      <span>Answered ${answered} / ${items.length} &middot; correct ${correct}</span>
      <button onclick="resetMCQ()">Reset this topic</button>
    </div>` + items.map((m,qi)=>{
      const chosen = mcqState[mcqKey(qi)];
      const done = chosen!==undefined;
      return `
      <div class="mcq-block">
        <div class="mcq-q">${qi+1}. ${m.q}</div>
        ${m.options.map((opt,oi)=>{
          let cls='mcq-opt';
          if(done && oi===m.correct) cls+=' correct';
          else if(done && oi===chosen) cls+=' wrong';
          return `<button class="${cls}" ${done?'disabled':''} onclick="answerMCQ(${qi},${oi})">${String.fromCharCode(97+oi)}. ${opt}</button>`;
        }).join('')}
        <div class="mcq-rationale${done?' shown':''}">${mdInline(m.rationale)}</div>
      </div>`;
    }).join('');
}
function answerMCQ(qi, chosen){ mcqState[mcqKey(qi)] = chosen; renderContent(); }
function resetMCQ(){
  PM_DATA[topicIdx].mcq.forEach((_,qi)=>delete mcqState[mcqKey(qi)]);
  renderContent();
}

/* ── open questions ──────────────────────────────────────────────────────────
   No model answer: write an answer, copy it, paste it into chat for feedback. */
function renderOpen(inner, items){
  const saved = answers[topicIdx] || {};
  inner.innerHTML = items.map((o,i)=>`
    <div class="oq-block">
      <div class="oq-q">${i+1}. ${o.q}</div>
      <textarea class="oq-input" id="oq-${i}" placeholder="Write your answer here…"
                oninput="saveAnswer(${i},this.value)">${esc(saved[i]||'')}</textarea>
      <button class="oq-copy" onclick="copyAnswer(${i},this)">&#128203; Copy answer</button>
    </div>`).join('');
}
function saveAnswer(i,val){ (answers[topicIdx] = answers[topicIdx] || {})[i] = val; }
function copyAnswer(i, btn){
  const t = PM_DATA[topicIdx];
  copyText(`Public Management — ${t.title}\n\nQuestion: ${t.open[i].q}\n\nMy answer:\n${document.getElementById('oq-'+i).value}`, btn, '\u{1F4CB} Copy answer');
}

/* ── pooled views ────────────────────────────────────────────────────────── */
function openPool(kind){
  view='pool'; type=kind;
  clearTopics(); clearFooter();
  document.getElementById({flashcards:'pool-flashcards-nav',mcq:'pool-mcq-nav',open:'pool-open-nav'}[kind]).classList.add('active');
  document.getElementById('tabs').style.display='none';
  pool = [];
  PM_DATA.forEach((t,ti)=>(t[kind]||[]).forEach((item,qi)=>pool.push({ti,qi,item})));
  pool = shuffle(pool);
  poolIdx = 0; fcAnswer = false;
  syncTabs();
  const label = {flashcards:'flashcards',mcq:'MCQ',open:'open questions'}[kind];
  document.getElementById('topic-title').textContent = `\u{1F3B2} All ${label} — pooled (${pool.length})`;
  if(kind==='flashcards') renderPoolFlashcard();
  else if(kind==='mcq')   renderPoolMCQ();
  else                    renderPoolOpen();
}
/* Blind pool card: the source topic stays hidden until the answer is revealed. */
function renderPoolFlashcard(){
  const inner = document.getElementById('inner');
  const {ti,item} = pool[poolIdx];
  inner.innerHTML = `
    <div class="fc-wrap">
      <div class="fc-progress">Card ${poolIdx+1} / ${pool.length} &middot; random order</div>
      <div class="fc-card${fcAnswer?' answer':''}" onclick="flipPoolCard()">
        <div class="fc-content">${fcAnswer ? item.a : item.q}</div>
      </div>
      ${fcAnswer ? `<div class="fc-topic-tag">${PM_DATA[ti].icon} ${PM_DATA[ti].title}</div>` : ''}
      <div class="fc-hint">Click the card (or press Space) to ${fcAnswer?'see the question':'reveal the answer &amp; topic'}</div>
      <div class="fc-controls">
        <button class="fc-btn" onclick="prevPoolCard()">&larr; Prev</button>
        <button class="fc-btn primary" onclick="flipPoolCard()">Flip</button>
        <button class="fc-btn" onclick="nextPoolCard()">Next &rarr;</button>
        <button class="fc-btn" onclick="reshufflePool()">&#127922; Shuffle</button>
      </div>
    </div>`;
}
function flipPoolCard(){ fcAnswer=!fcAnswer; renderPoolFlashcard(); }
function nextPoolCard(){ poolIdx=(poolIdx+1)%pool.length; fcAnswer=false; renderPoolFlashcard(); }
function prevPoolCard(){ poolIdx=(poolIdx-1+pool.length)%pool.length; fcAnswer=false; renderPoolFlashcard(); }
function reshufflePool(){ pool=shuffle(pool); poolIdx=0; fcAnswer=false; renderPoolFlashcard(); }

function renderPoolMCQ(){
  const inner = document.getElementById('inner');
  const answered = pool.filter((_,i)=>poolMcq[i]!==undefined).length;
  const correct  = pool.filter((p,i)=>poolMcq[i]===p.item.correct).length;
  inner.innerHTML = `
    <div class="mcq-score">
      <span>Answered ${answered} / ${pool.length} &middot; correct ${correct}</span>
      <button onclick="openPool('mcq')">&#127922; Reshuffle &amp; reset</button>
    </div>` + pool.map((p,i)=>{
      const chosen = poolMcq[i], done = chosen!==undefined, m = p.item;
      return `
      <div class="mcq-block">
        <div class="mcq-q">${i+1}. ${m.q}</div>
        ${m.options.map((opt,oi)=>{
          let cls='mcq-opt';
          if(done && oi===m.correct) cls+=' correct';
          else if(done && oi===chosen) cls+=' wrong';
          return `<button class="${cls}" ${done?'disabled':''} onclick="answerPoolMCQ(${i},${oi})">${String.fromCharCode(97+oi)}. ${opt}</button>`;
        }).join('')}
        <div class="mcq-rationale${done?' shown':''}">
          <div class="fc-topic-tag" style="margin-bottom:8px">${PM_DATA[p.ti].icon} ${PM_DATA[p.ti].title}</div>
          ${mdInline(m.rationale)}
        </div>
      </div>`;
    }).join('');
}
function answerPoolMCQ(i, chosen){ poolMcq[i]=chosen; renderPoolMCQ(); }

function renderPoolOpen(){
  document.getElementById('inner').innerHTML = pool.map((p,i)=>`
    <div class="oq-block">
      <div class="oq-q">${i+1}. ${p.item.q}</div>
      <div class="fc-topic-tag" style="margin-bottom:10px">${PM_DATA[p.ti].icon} ${PM_DATA[p.ti].title}</div>
      <textarea class="oq-input" id="pool-oq-${i}" placeholder="Write your answer here…"
                oninput="poolAnswers[${i}]=this.value">${esc(poolAnswers[i]||'')}</textarea>
      <button class="oq-copy" onclick="copyPoolAnswer(${i},this)">&#128203; Copy answer</button>
    </div>`).join('');
}
function copyPoolAnswer(i, btn){
  const p = pool[i];
  copyText(`Public Management — ${PM_DATA[p.ti].title}\n\nQuestion: ${p.item.q}\n\nMy answer:\n${document.getElementById('pool-oq-'+i).value}`, btn, '\u{1F4CB} Copy answer');
}

/* ── mock exam: 3 open questions, one each from 3 distinct random topics ──── */
function openMock(){
  view='mock';
  clearTopics(); clearFooter();
  document.getElementById('mock-nav').classList.add('active');
  document.getElementById('tabs').style.display='none';
  drawMock();
}
function drawMock(){
  const topics = shuffle(PM_DATA.map((_,i)=>i)).slice(0,3);
  mock = topics.map(ti=>{
    const qi = Math.floor(Math.random()*PM_DATA[ti].open.length);
    return {ti, qi, q: PM_DATA[ti].open[qi].q};
  });
  for(const k in mockAnswers) delete mockAnswers[k];
  document.getElementById('topic-title').textContent = '\u{1F4DD} Mock Exam — 3 open questions';
  renderMock();
}
function renderMock(){
  document.getElementById('inner').innerHTML = `
    <div class="exam-intro">Exam simulation &middot; answer all three questions in your own words, then copy each (or all) for feedback. Each question is drawn from a different topic.</div>
    ${mock.map((m,i)=>`
      <div class="oq-block">
        <div class="oq-q"><b>Question ${i+1}.</b> ${m.q}</div>
        <textarea class="oq-input" id="mock-oq-${i}" placeholder="Write your answer here…"
                  oninput="mockAnswers[${i}]=this.value">${esc(mockAnswers[i]||'')}</textarea>
        <button class="oq-copy" onclick="copyMockAnswer(${i},this)">&#128203; Copy this answer</button>
      </div>`).join('')}
    <div class="exam-actions">
      <button class="fc-btn primary" onclick="copyMockAll(this)">&#128203; Copy all 3 answers</button>
      <button class="fc-btn" onclick="drawMock()">&#127922; Draw a new exam</button>
    </div>`;
}
function copyMockAnswer(i, btn){
  const m = mock[i];
  copyText(`Public Management Mock — ${PM_DATA[m.ti].title}\n\nQuestion: ${m.q}\n\nMy answer:\n${document.getElementById('mock-oq-'+i).value}`, btn, '\u{1F4CB} Copy this answer');
}
function copyMockAll(btn){
  const payload = 'PUBLIC MANAGEMENT MOCK EXAM — my answers\n\n' + mock.map((m,i)=>
    `Question ${i+1} (${PM_DATA[m.ti].title}): ${m.q}\n\nMy answer:\n${document.getElementById('mock-oq-'+i).value}`
  ).join('\n\n──────────\n\n');
  copyText(payload, btn, '\u{1F4CB} Copy all 3 answers');
}

/* ── clipboard ───────────────────────────────────────────────────────────── */
function copyText(text, btn, restore){
  const label = restore || btn.textContent;
  const done = ()=>{ btn.textContent='✓ Copied'; setTimeout(()=>btn.textContent=label,1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  document.body.removeChild(ta);
}

/* ── keyboard: only while a flashcard view is showing and nothing is focused ─ */
document.addEventListener('keydown', e=>{
  if(type!=='flashcards' || view==='mock') return;
  const tag = (document.activeElement||{}).tagName;
  if(tag==='TEXTAREA' || tag==='INPUT') return;
  const inPool = view==='pool';
  if(e.key===' '){ e.preventDefault(); inPool?flipPoolCard():flipCard(); }
  else if(e.key==='ArrowRight'){ inPool?nextPoolCard():nextCard(); }
  else if(e.key==='ArrowLeft'){ inPool?prevPoolCard():prevCard(); }
});

initNav();
renderTopic();
</script>
