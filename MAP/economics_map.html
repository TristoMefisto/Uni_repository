        > Expected utility, measures of risk aversion and how to rank risky prospects.
        = D81
        @ UNIBO/Foundations (PE1)/Pages/07. Social insurance

        > What happens when one side knows more. Signalling, screening and the principal-agent problem in contracts.
        = D82
        @ UNIBO/Foundations (PE1)/Pages/07. Social insurance
        Signalling
          > The informed side takes a costly action to reveal its type, as in education as a signal of ability.
          = D82
        Screening
          > The uninformed side offers a menu of contracts so that types sort themselves.
          = D82
        Principal-agent and incentive contracts
          > How to pay someone whose effort cannot be observed, trading insurance against incentives.

        > Designing rules so that self-interested agents reveal what they know. Auctions are the main application.
        = D44

        = C78

      > Systematic departures from the standard model of choice and what they mean for welfare and policy.
      = D9
      @ UNIBO/Negotiation And Bargaining/Pages/03. Behavioral economics and the psychology of first offers
      Prospect theory and reference dependence
        > Outcomes are judged as gains and losses from a reference point, and losses weigh more.
        = D91
      Present bias and self-control
        > People overweight the present, so plans made today are not followed tomorrow.
        = D15
      Limited attention and salience
        > People respond to what they notice, so the way a price or tax is shown changes behaviour.
        = D91
      Nudges and choice architecture
        > Changing how options are presented, without changing incentives, to steer choices.
        = D91
        @ UNITE/Public policy analysis/Pages/03. Policy tools
      Behavioural welfare economics
        > If choices are biased, they no longer reveal wellbeing. How to evaluate policy then.
        = D60

      > Modern macroeconomics built on optimising households and firms, beyond the IS-LM and AD-AS models in the vault.
      = E
      @ UNITE/Politica Economica/Pages/06. Il modello AD-AS

        > Households smooth consumption over their lifetime, so it depends on permanent rather than current income.
        = E21
      Investment
        > Firms invest when the market value of capital exceeds its replacement cost.
        = E22
      Real business cycles
        > Fluctuations as efficient responses to technology shocks, in a model with flexible prices.
        = E32
      New Keynesian model
        > Sticky prices give monetary policy real effects. The Phillips curve becomes forward-looking and policy follows an interest-rate rule.
        = E12
        @ UNITE/Politica Economica/Pages/10. La curva di Phillips e le aspettative
        Sticky prices

        Taylor rule
          > The central bank sets the interest rate in response to inflation and the output gap.
          = E52
      DSGE models
        > Dynamic, stochastic general-equilibrium models estimated on data and used by central banks for policy analysis.
        = E37
      Search and unemployment

        = E24
    Growth and development
      > Why some countries are rich and others poor, and what can change it.

      @ UNITE/Geografia Economica/Pages/11. Le politiche dello sviluppo economico
      Solow model
        > Growth from capital accumulation runs out; in the long run only technology raises income per head.
        = O41
      Endogenous growth
        > Models in which ideas, research and human capital make growth itself an outcome of the economy.
        = O31
      Institutions and growth

        = O43
      Development economics

        @ UNIBO/Field experiments/Field experiments course page

    International economics

      @ UNITE/Geografia Economica/Pages/08. Il commercio internazionale
      Trade theory

        Comparative advantage

        Heckscher-Ohlin

        New trade theory

      Gravity model
        > Trade between two countries grows with their size and falls with distance. The workhorse of empirical trade.
        = F14
      Trade policy

        = F13
        @ UNIBO/IPEU/Pages/05. Common trade policy
      International finance
        > How exchange rates are determined, why capital flows reverse, and how currency crises happen.
        = F31
        @ UNITE/Politica Economica/Pages/12. Il tasso di cambio e la bilancia dei pagamenti
      Multinationals and FDI
        > Why firms produce abroad and what foreign investment does to host countries.
        = F23
        @ UNITE/Geografia Economica/Pages/06. Le filiere industriali
    Financial economics
      > How assets are priced, how firms are financed and how banks work, in theory.
      = G
      Asset pricing
        > Expected returns compensate for risk that cannot be diversified away.
        = G12
        CAPM and factor models
          > Returns explained by exposure to the market, or to a few factors.
          = G12
        Market efficiency

      Corporate finance

        = G32
      Banking theory

        @ UNITE/Crisis economics/Pages/02. Bankers gone wild
    Labour economics

        @ Concepts/Econometrics topics/07. Bunching and sufficient statistics

        Returns to schooling

      Wages and minimum wages

        @ UNIBO/Econometric methods for policy evaluation/Material/Class papers/Companion notes/Card & Krueger (1994) Minimum Wages and Employment
      Discrimination

      Migration

        @ UNITE/Geografia Economica/Pages/03. Popolazione, lavoro, migrazioni, società, culture
    Public economics beyond the course

      @ UNIBO/Foundations (PE1)/Pages/00. Introduction

        = I2

        = I32
        @ UNIBO/Economic Statistics/Pages/07. Economic inequality
    Industrial organisation theory
      > The theory of imperfect competition beyond monopoly and Cournot.

        > Testing whether a relation changed at some date.
        = C22
    Microeconometric models
      > Models for outcomes that are not continuous and unrestricted.
      = C2
      @ UNIBO/Econometrics/Pages/07. Binary response models
      Censored and truncated outcomes
        > Tobit and related models, for outcomes piled up at a limit such as zero hours worked.
        = C24
        @ Concepts/Math refresher/09. Estimation methods beyond OLS
      Count data
        > Poisson and negative binomial models for outcomes that are counts.
        = C25
      Duration models
        > How long until something happens, such as leaving unemployment, with hazard rates.
        = C41
      Ordered response
        > Outcomes with ordered categories, such as satisfaction scales.
        = C25
      Quantile regression
        > Effects on different points of the outcome distribution, not only the mean.
        = C21
      Discrete choice demand
        > Demand estimated from choices among many products, as in nested logit and BLP.
        = C25
        @ UNIBO/Machine learning/Pages/02. Regression and classification
    Advanced panel data
      > Panel methods beyond fixed and random effects.
      = C23
      @ UNIBO/Econometrics/Pages/08 and 09. Panel data methods
      Dynamic panels
        > Models with the lagged outcome as a regressor, which fixed effects cannot handle. Arellano-Bond uses earlier lags as instruments.
        = C23
      Nonlinear panel models
        > Logit, probit and count models with unit effects, and the incidental parameters problem.
        = C23
      Interactive fixed effects
        > Unit effects that load on common time factors, so trends can differ across units.
        = C23
    IV beyond the course
      > Instrumental-variable topics that the vault only mentions.
      = C26
      @ UNIBO/Econometric methods for policy evaluation/Pages/04. Instrumental variables
      Weak instruments
        > When the first stage is weak, 2SLS is biased towards OLS and its tests mislead.
        = C26
      Shift-share instruments
        > Local exposure to national shocks as an instrument, and when it is valid.
        = C26
      Judge designs
        > Random assignment to decision-makers of different strictness used as an instrument.
        = C26
      Overidentification tests
        > With more instruments than regressors, we can test whether they agree.
        = C26
    Structural estimation
      > Estimating the parameters of an economic model, so that counterfactual policies can be simulated.
      = C51
      Simulation-based estimation
        > Simulated method of moments and indirect inference, when the likelihood cannot be written down.
        = C15
      Dynamic discrete choice
        > Agents choosing today with the future in mind, such as when to retire.
        = C61
    Bayesian econometrics
      > Inference that combines a prior with the data to give a posterior distribution.
      = C11
      Priors and posteriors
        > How beliefs are updated with data, and what the posterior summarises.
        = C11
      MCMC
        > Simulation methods that draw from the posterior when it has no closed form.
        = C11
      Bayesian VARs
        > VARs with priors that shrink the many coefficients, used in forecasting.
        = C32
        ~ Vector autoregressions
    Nonparametric and semiparametric methods
      > Estimating relations without assuming their functional form, or only part of it.
      = C14
      @ Concepts/Math refresher/09. Estimation methods beyond OLS
      Series and sieve estimators
        > Approximating an unknown function with a growing number of basis terms.
        = C14
      Semiparametric models
        > Models with a parametric part of interest and an unrestricted nuisance part.
        = C14
    Spatial econometrics
      > Models in which outcomes depend on neighbouring units.
      = C21
      Spatial weights
        > The matrix that defines who is a neighbour of whom.
        = C21
      Spatial lag and error models
        > Outcomes that depend on neighbours' outcomes, or errors that are correlated across space.
        = C21
    Survey data and measurement
      > Working with survey data and imperfect measures.
      = C8
      @ UNITE/Statistica/Pages/08. Campionamento e distribuzioni campionarie
      Survey weights and complex designs
        > Using sampling weights, strata and clusters correctly in estimation.
        = C83
      Missing data and imputation
        > What missing values do to estimates and how to fill them in.
        = C81
</script>

<script>
(function(){
'use strict';
var VAULT='University';
var PALETTE=['#2a62c9','#0c7f76','#2f7d32','#9a6700','#c2541d','#c0364a','#7a48c7','#55637a','#b02a78','#0a7ea4','#6b7a12','#8a5a2b','#9c3c9c'];
var ROW=34,H=28,GAPX=46,PAD=24,SVGNS='http://www.w3.org/2000/svg';
var canvas=document.getElementById('canvas'),stage=document.getElementById('stage'),
    svg=document.getElementById('links'),panel=document.getElementById('panel'),
    q=document.getElementById('q'),count=document.getElementById('count');
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

var root=null,all=[],byTitle={};
function save(k,v){try{localStorage.setItem('econmap.'+k,v);}catch(e){}}
function load(k){try{return localStorage.getItem('econmap.'+k);}catch(e){return null;}}

var DATA=location.hash==='#gaps'?'gaps':(location.hash==='#vault'?'vault':(load('data')==='gaps'?'gaps':'vault'));
function outlineText(){return document.getElementById(DATA==='gaps'?'outline-gaps':'outline').textContent;}
function parseAndBuild(text){
/* ---- parse the outline ---- */
var stack=[];root=null;all=[];
text.split('\n').forEach(function(raw){
  if(!raw.trim())return;
  var ind=raw.match(/^ */)[0].length/2,s=raw.trim();
  if(s.indexOf('- ')===0){stack[ind-1].bullets.push(s.slice(2));return;}
  if(s.indexOf('@ ')===0){stack[ind-1].own.push(s.slice(2));return;}
  if(s.indexOf('! ')===0){stack[ind-1].flag=s.slice(2);return;}
  if(s.indexOf('> ')===0){var o=stack[ind-1];o.desc=(o.desc?o.desc+' ':'')+s.slice(2);return;}
  if(s.indexOf('= ')===0){stack[ind-1].jel=s.slice(2);return;}
  if(s.indexOf('~ ')===0){stack[ind-1].rel.push(s.slice(2));return;}
  var n={title:s,depth:ind,children:[],bullets:[],own:[],desc:'',jel:'',rel:[],links:[],flag:'',parent:ind?stack[ind-1]:null,open:false,vis:false,cx:0,cy:0,tx:0,ty:0};
  if(n.parent)n.parent.children.push(n);else root=n;
  stack[ind]=n;stack.length=ind+1;all.push(n);
});
var leaves=0;
all.forEach(function(n){
  n.src=n.own.length?n.own:(n.parent?n.parent.src:[]);
  if(n.depth<2)n.acc=n.flag?'#8a8f99':'#1d2330';
  else if(n.depth===2)n.acc=n.parent.flag?'#8a8f99':PALETTE[n.parent.children.indexOf(n)%PALETTE.length];
  else n.acc=n.parent.acc;
  if(n.parent&&n.parent.flag&&!n.flag)n.flag=n.parent.flag;
  /* the root's children alternate left (-1) and right (+1); a branch keeps its side */
  n.side=n.depth===0?0:(n.depth===1?(n.parent.children.indexOf(n)%2?1:-1):n.parent.side);
  if(!n.children.length&&!n.flag)leaves++;
});
document.getElementById('meta').textContent=leaves+(DATA==='gaps'?' topics not covered':' topics');
/* related entries: "~ Title" or "~ Parent / Title", made symmetric */
byTitle={};
all.forEach(function(n){(byTitle[n.title]=byTitle[n.title]||[]).push(n);});
function findNode(key){
  var i=key.indexOf(' / ');
  if(i>0){var pt=key.slice(0,i),t=key.slice(i+3),c=(byTitle[t]||[]).filter(function(n){return n.parent&&n.parent.title===pt;});if(c.length===1)return c[0];}
  var c2=byTitle[key]||[];return c2.length===1?c2[0]:null;
}
all.forEach(function(n){n.rel.forEach(function(k){
  var m=findNode(k);
  if(!m){if(window.console)console.warn('Economics map: unresolved link',n.title,'~',k);return;}
  if(n.links.indexOf(m)<0)n.links.push(m);if(m.links.indexOf(n)<0)m.links.push(n);
});});
/* ---- build elements once ---- */
all.forEach(function(n){
  var b=document.createElement('button');b.type='button';
  b.className='node d'+Math.min(n.depth,3)+(n.children.length?' parent':' leaf')+(n.flag?' '+n.flag:'')+(n.side<0?' L':'');
  b.style.setProperty('--acc',n.acc);
  var t=document.createElement('span');t.textContent=n.title;b.appendChild(t);
  if(n.children.length){var c=document.createElement('span');c.className='n';c.textContent=n.children.length;b.appendChild(c);b.setAttribute('aria-expanded','false');}
  b.addEventListener('click',function(){onClick(n);});
  stage.appendChild(b);n.el=b;
  if(n.parent){var p=document.createElementNS(SVGNS,'path');p.setAttribute('class','link');p.style.setProperty('--acc',n.acc);svg.appendChild(p);n.path=p;}
});
all.forEach(function(n){n.w=n.el.offsetWidth;});
all.forEach(function(n){n.el.style.display='none';if(n.path)n.path.style.display='none';});
}
parseAndBuild(outlineText());

/* ---- layout ---- */
function kids(n){return n.open?n.children:[];}
/* The root sits in the middle; each half is a tidy tree growing away from it. */
function layout(){
  root.tx=-root.w/2;root.ty=0;
  var placed=[root],minX=root.tx,maxX=root.w/2,minY=0,maxY=H;
  [-1,1].forEach(function(side){
    var tops=kids(root).filter(function(c){return c.side===side;});
    if(!tops.length)return;
    var colW=[];
    tops.forEach(function walk(n){colW[n.depth]=Math.max(colW[n.depth]||0,n.w);kids(n).forEach(walk);});
    var colX=[],x=root.w/2+GAPX;
    for(var d=1;d<colW.length;d++){colX[d]=x;x+=colW[d]+GAPX;}
    var y=0,mine=[];
    function place(n){
      mine.push(n);
      n.tx=side>0?colX[n.depth]:-colX[n.depth]-n.w;
      var ch=kids(n);
      if(!ch.length){n.ty=y;y+=ROW;}
      else{ch.forEach(place);n.ty=(ch[0].ty+ch[ch.length-1].ty)/2;y+=8;}
    }
    tops.forEach(place);
    var mid=(tops[0].ty+tops[tops.length-1].ty)/2;
    mine.forEach(function(n){
      n.ty-=mid;placed.push(n);
      minX=Math.min(minX,n.tx);maxX=Math.max(maxX,n.tx+n.w);
      minY=Math.min(minY,n.ty);maxY=Math.max(maxY,n.ty+H);
    });
  });
  var cw=maxX-minX,ch=maxY-minY;
  var ox=Math.max(PAD,(canvas.clientWidth/Z-cw)/2)-minX,oy=Math.max(PAD,(canvas.clientHeight/Z-ch)/2)-minY;
  placed.forEach(function(n){n.tx+=ox;n.ty+=oy;});
  return {w:cw+2*PAD,h:ch+2*PAD};
}
var size={w:0,h:0},raf=0,guard=0,selected=null,Z=1;
function setStage(w,h){stage.style.width=Math.max(w,canvas.clientWidth/Z)+'px';stage.style.height=Math.max(h,canvas.clientHeight/Z)+'px';}
function draw(list){
  for(var i=0;i<list.length;i++){
    var n=list[i];
    n.el.style.transform='translate('+n.cx.toFixed(1)+'px,'+n.cy.toFixed(1)+'px)';
    if(n.path){
      var p=n.parent,r=n.side>0,x1=r?p.cx+p.w:p.cx,y1=p.cy+H/2,x2=r?n.cx:n.cx+n.w,y2=n.cy+H/2,m=(x1+x2)/2;
      n.path.setAttribute('d','M'+x1.toFixed(1)+' '+y1.toFixed(1)+'C'+m.toFixed(1)+' '+y1.toFixed(1)+' '+m.toFixed(1)+' '+y2.toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1));
    }
  }
}
function update(anchor,focus,instant){
  cancelAnimationFrame(raf);
  var list=[];
  (function walk(n,shown){
    if(shown){
      if(!n.vis){n.vis=true;n.el.style.display='';if(n.path)n.path.style.display='';
        if(n.parent){n.cx=n.side>0?n.parent.cx:n.parent.cx+n.parent.w-n.w;n.cy=n.parent.cy;}}
      list.push(n);
    }else if(n.vis){n.vis=false;n.el.style.display='none';if(n.path)n.path.style.display='none';}
    n.el.classList.toggle('open',n.open&&n.children.length>0);
    if(n.children.length)n.el.setAttribute('aria-expanded',n.open?'true':'false');
    n.children.forEach(function(c){walk(c,shown&&n.open);});
  })(root,true);
  var next=layout();
  setStage(Math.max(size.w,next.w),Math.max(size.h,next.h));
  var start=list.map(function(n){return [n.cx,n.cy];});
  var ax=anchor?anchor.cx:0,ay=anchor?anchor.cy:0,sl=canvas.scrollLeft,st=canvas.scrollTop;
  var dur=(instant||reduce||document.hidden)?0:260,t0=performance.now();
  function frame(now){
    var k=dur?Math.min(1,(now-t0)/dur):1,e=1-Math.pow(1-k,3);
    for(var i=0;i<list.length;i++){var n=list[i];n.cx=start[i][0]+(n.tx-start[i][0])*e;n.cy=start[i][1]+(n.ty-start[i][1])*e;}
    draw(list);
    if(anchor){canvas.scrollLeft=sl+(anchor.cx-ax)*Z;canvas.scrollTop=st+(anchor.cy-ay)*Z;}
    if(k<1){raf=requestAnimationFrame(frame);return;}
    clearTimeout(guard);
    size=next;setStage(next.w,next.h);
    var beh=dur?'smooth':'auto';
    if(focus)canvas.scrollTo({left:Math.max(0,(focus.tx+focus.w/2)*Z-canvas.clientWidth/2),top:Math.max(0,(focus.ty+H/2)*Z-canvas.clientHeight/2),behavior:beh});
    else if(anchor&&anchor.side&&anchor.open&&anchor.children.length){
      /* bring the newly opened column into view, without losing the clicked node */
      var want;
      if(anchor.side>0){
        var right=0;anchor.children.forEach(function(c){right=Math.max(right,c.tx+c.w+PAD);});
        want=Math.min(right*Z-canvas.clientWidth,(anchor.tx-PAD)*Z);
        if(want>canvas.scrollLeft)canvas.scrollTo({left:want,behavior:beh});
      }else{
        var left=Infinity;anchor.children.forEach(function(c){left=Math.min(left,c.tx-PAD);});
        want=Math.max(0,left*Z,(anchor.tx+anchor.w+PAD)*Z-canvas.clientWidth);
        if(want<canvas.scrollLeft)canvas.scrollTo({left:want,behavior:beh});
      }
    }
  }
  /* if frames are throttled (hidden pane or iframe), jump to the final layout */
  clearTimeout(guard);
  if(dur)guard=setTimeout(function(){cancelAnimationFrame(raf);dur=0;frame(0);},600);
  frame(t0);
}

/* ---- interaction ---- */
function select(n){
  if(selected)selected.el.classList.remove('sel');
  selected=n;if(n)n.el.classList.add('sel');
  renderPanel();
  if(view==='wheel')wheelPaint();
}
function onClick(n){
  if(n.children.length)n.open=!n.open;
  select(n);update(n);
}
function reveal(n){
  for(var p=n.parent;p;p=p.parent)p.open=true;
  if(view==='wheel'){select(n);wheelFocus(n.children.length?n:(n.parent||root));return;}
  select(n);update(null,n);
}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function renderPanel(){
  panel.textContent='';
  var n=selected;
  if(!n){
    panel.appendChild(el('p','empty',DATA==='gaps'?'Fields and methods not covered in the vault yet, with their JEL code. Click a branch to open it.':'Click a branch to open it. Each topic shows its key points and the vault page it comes from.'));
    return;
  }
  panel.style.setProperty('--pacc',n.acc);
  var path=[];for(var p=n.parent;p;p=p.parent)path.unshift(p);
  if(path.length){
    var cr=el('div','crumbs');
    path.forEach(function(a,i){
      var b=el('button',null,a.title);b.type='button';b.addEventListener('click',function(){reveal(a);});
      cr.appendChild(b);if(i<path.length-1)cr.appendChild(document.createTextNode(' › '));
    });
    panel.appendChild(cr);
  }
  panel.appendChild(el('h2',null,n.title));
  if(n.desc)panel.appendChild(el('p','desc',n.desc));
  if(n.jel)panel.appendChild(el('div','jel','JEL '+n.jel));
  if(n.bullets.length){panel.appendChild(el('div','lab','Key points'));var ul=el('ul');n.bullets.forEach(function(b){ul.appendChild(el('li',null,b));});panel.appendChild(ul);}
  if(n.children.length){
    panel.appendChild(el('div','lab','Contains'));
    var ch=el('div','chips');
    n.children.forEach(function(c){var b=el('button',null,c.title);b.type='button';b.addEventListener('click',function(){reveal(c);});ch.appendChild(b);});
    panel.appendChild(ch);
  }
  if(n.links.length){
    panel.appendChild(el('div','lab','Related'));
    var rl=el('div','chips rel');
    n.links.forEach(function(c){
      var b=el('button',null,c.title);b.type='button';b.style.setProperty('--acc',c.acc);
      if(c.parent)b.appendChild(el('small',null,c.parent.title));
      b.addEventListener('click',function(){reveal(c);});rl.appendChild(b);
    });
    panel.appendChild(rl);
  }
  if(n.src.length){
    panel.appendChild(el('div','lab',DATA==='gaps'?'Builds on, in your vault':'In the vault'));
    n.src.forEach(function(s){
      var a=el('a',null,s.split('/').pop());
      a.href='obsidian://open?vault='+encodeURIComponent(VAULT)+'&file='+encodeURIComponent(s);
      panel.appendChild(a);
    });
  }
}
q.addEventListener('input',function(){
  var s=q.value.trim().toLowerCase();
  all.forEach(function(n){n.el.classList.remove('hit');n.hit=false;});
  if(view==='wheel')wheelPaint();
  if(s.length<2){count.textContent='';return;}
  var hits=all.filter(function(n){
    return n.title.toLowerCase().indexOf(s)>=0||n.desc.toLowerCase().indexOf(s)>=0||n.bullets.some(function(b){return b.toLowerCase().indexOf(s)>=0;});
  });
  count.textContent=hits.length+(hits.length===1?' match':' matches');
  if(!hits.length)return;
  all.forEach(function(n){n.open=false;});
  hits.forEach(function(n){n.el.classList.add('hit');for(var p=n.parent;p;p=p.parent)p.open=true;});
  hits.forEach(function(n){n.hit=true;});
  if(view==='wheel'){wheelPaint();wheelFocus(lca(hits));}else update(null,hits[0]);
});
document.getElementById('expand').addEventListener('click',function(){
  all.forEach(function(n){n.open=n.children.length>0;});update(root);
});
function home(){
  all.forEach(function(n){n.open=n.depth===0||(n.depth===1&&!n.flag);});
}
document.getElementById('collapse').addEventListener('click',function(){
  home();update(null,root);if(view==='wheel')wheelFocus(root);
});
var rz=0;
window.addEventListener('resize',function(){cancelAnimationFrame(rz);rz=requestAnimationFrame(function(){update(selected&&selected.vis?selected:root);});});
/* drag to pan */
var drag=null;
canvas.addEventListener('pointerdown',function(e){
  if(e.target.closest('.node')||e.pointerType==='touch')return;
  drag={x:e.clientX,y:e.clientY,l:canvas.scrollLeft,t:canvas.scrollTop};
  canvas.classList.add('drag');canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',function(e){
  if(!drag)return;canvas.scrollLeft=drag.l-(e.clientX-drag.x);canvas.scrollTop=drag.t-(e.clientY-drag.y);
});
['pointerup','pointercancel'].forEach(function(t){canvas.addEventListener(t,function(){drag=null;canvas.classList.remove('drag');});});

/* zoom: buttons, ctrl/cmd + wheel, trackpad pinch */
var zl=document.getElementById('zlabel');
function setZoom(z,px,py){
  z=Math.min(2,Math.max(0.3,z));
  var r=canvas.getBoundingClientRect();
  if(px==null){px=r.left+canvas.clientWidth/2;py=r.top+canvas.clientHeight/2;}
  var dx=px-r.left,dy=py-r.top;
  var rx=(canvas.scrollLeft+dx)/Z-root.cx,ry=(canvas.scrollTop+dy)/Z-root.cy;
  Z=z;stage.style.zoom=Z;
  update(null,null,true);
  canvas.scrollLeft=(root.cx+rx)*Z-dx;canvas.scrollTop=(root.cy+ry)*Z-dy;
  zl.textContent=Math.round(Z*100)+'%';save('zoom',Z);
}
document.getElementById('zin').addEventListener('click',function(){setZoom(Z*1.2);});
document.getElementById('zout').addEventListener('click',function(){setZoom(Z/1.2);});
zl.addEventListener('click',function(){setZoom(1);});
document.getElementById('zfit').addEventListener('click',function(){
  setZoom(Math.min(1.5,canvas.clientWidth/size.w,canvas.clientHeight/size.h));
  canvas.scrollLeft=(size.w*Z-canvas.clientWidth)/2;canvas.scrollTop=(size.h*Z-canvas.clientHeight)/2;
});
canvas.addEventListener('wheel',function(e){
  if(!(e.ctrlKey||e.metaKey))return;
  e.preventDefault();setZoom(Z*Math.exp(-e.deltaY*0.01),e.clientX,e.clientY);
},{passive:false});
/* side panel width: drag the divider, or arrow keys when it is focused */
var grip=document.getElementById('grip'),gd=false;
function setPanel(w){
  w=Math.round(Math.min(Math.max(w,240),Math.max(240,window.innerWidth-280)));
  document.documentElement.style.setProperty('--pw',w+'px');return w;
}
function relayout(){update(selected&&selected.vis?selected:root,null,true);}
grip.addEventListener('pointerdown',function(e){gd=true;grip.classList.add('on');grip.setPointerCapture(e.pointerId);e.preventDefault();});
grip.addEventListener('pointermove',function(e){if(gd)save('panel',setPanel(window.innerWidth-e.clientX));});
['pointerup','pointercancel'].forEach(function(t){grip.addEventListener(t,function(){if(!gd)return;gd=false;grip.classList.remove('on');relayout();});});
grip.addEventListener('keydown',function(e){
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  e.preventDefault();save('panel',setPanel(panel.offsetWidth+(e.key==='ArrowLeft'?24:-24)));relayout();
});
var pw0=parseFloat(load('panel'));if(pw0)setPanel(pw0);
var z0=parseFloat(load('zoom'));if(z0>=0.3&&z0<=2){Z=z0;stage.style.zoom=Z;zl.textContent=Math.round(Z*100)+'%';}

/* ===== Wheel view: zoomable sunburst. Centre = current focus, 3 rings outwards, sector size = number of topics. ===== */
var view='tree',RINGS=3,TAU=Math.PI*2,SVGN=SVGNS;
var wheel=document.getElementById('wheel'),wsvg=document.getElementById('wsvg'),wdefs=document.getElementById('wdefs'),
    warcs=document.getElementById('warcs'),wc=document.getElementById('wcenter');
var W={focus:root,cx:0,cy:0,R:0,r0:0,rw:0,raf:0};
var mctx=document.createElement('canvas').getContext('2d');
function tw(t,bold){mctx.font=(bold?'600':'500')+' 11px system-ui,-apple-system,"Segoe UI",sans-serif';return mctx.measureText(t).width;}
function buildWheel(){
(function cnt(n){n.leafN=n.children.length?n.children.reduce(function(a,c){return a+cnt(c);},0):1;return n.leafN;})(root);
(function pos(n,x0){n.x0=x0;n.x1=x0+n.leafN/root.leafN;var x=x0;n.children.forEach(function(c){pos(c,x);x=c.x1;});})(root,0);
all.forEach(function(n,i){
  if(!n.depth)return;
  var g=document.createElementNS(SVGN,'g');g.setAttribute('class','arc');g.setAttribute('tabindex','0');g.setAttribute('role','button');
  g.setAttribute('aria-label',n.title);
  var path=document.createElementNS(SVGN,'path'),tt=document.createElementNS(SVGN,'title');tt.textContent=n.title;path.appendChild(tt);
  var lp=document.createElementNS(SVGN,'path');lp.id='wl'+i;wdefs.appendChild(lp);
  var tx=document.createElementNS(SVGN,'text'),tp=document.createElementNS(SVGN,'textPath');
  tp.setAttribute('href','#wl'+i);tp.setAttribute('startOffset','50%');tp.setAttribute('text-anchor','middle');tx.setAttribute('dy','0.35em');
  var rt=document.createElementNS(SVGN,'text');rt.setAttribute('text-anchor','middle');rt.setAttribute('dy','0.35em');
  tx.appendChild(tp);g.appendChild(path);g.appendChild(tx);g.appendChild(rt);warcs.appendChild(g);
  n.wg=g;n.wp=path;n.wlp=lp;n.wtx=tx;n.wtp=tp;n.wrt=rt;n.tw=[tw(n.title,false),tw(n.title,true)];
  function act(){select(n);if(n.children.length&&n!==W.focus)wheelFocus(n);}
  g.addEventListener('click',act);
  g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
});
}
buildWheel();
function goUp(){if(W.focus.parent){var p=W.focus.parent;select(p);wheelFocus(p);}}
wc.addEventListener('click',goUp);
wc.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();goUp();}});
function lca(list){
  var a=list[0];
  list.forEach(function(n){var anc=[];for(var p=n;p;p=p.parent)anc.push(p);while(anc.indexOf(a)<0)a=a.parent;});
  return a.children.length?a:(a.parent||root);
}
function targets(p){
  var sp=p.x1-p.x0;
  all.forEach(function(n){
    n.ta0=Math.min(1,Math.max(0,(n.x0-p.x0)/sp));n.ta1=Math.min(1,Math.max(0,(n.x1-p.x0)/sp));n.td=n.depth-p.depth;
  });
}
function wheelSize(){
  var w=wheel.clientWidth,h=wheel.clientHeight;if(!w||!h)return false;
  wsvg.setAttribute('viewBox','0 0 '+w+' '+h);
  W.cx=w/2;W.cy=h/2;W.R=Math.max(90,Math.min(w,h)/2-10);W.r0=Math.max(52,W.R*0.22);W.rw=(W.R-W.r0)/RINGS;
  var c=wc.querySelector('circle');c.setAttribute('cx',W.cx);c.setAttribute('cy',W.cy);c.setAttribute('r',W.r0-2);
  centreLabel();return true;
}
function pt(r,t){return (W.cx+r*Math.sin(t)).toFixed(1)+' '+(W.cy-r*Math.cos(t)).toFixed(1);}
function ring(r){return 'M'+pt(r,0)+'A'+r+' '+r+' 0 1 1 '+pt(r,Math.PI)+'A'+r+' '+r+' 0 1 1 '+pt(r,0);}
function sector(t0,t1,ri,ro){
  if(t1-t0>TAU-1e-6)return ring(ro)+ring(ri)+'Z';
  var L=t1-t0>Math.PI?1:0;
  return 'M'+pt(ro,t0)+'A'+ro+' '+ro+' 0 '+L+' 1 '+pt(ro,t1)+'L'+pt(ri,t1)+'A'+ri+' '+ri+' 0 '+L+' 0 '+pt(ri,t0)+'Z';
}
function cut(n,bold,avail){
  var w=n.tw[bold?1:0];if(w<=avail)return n.title;
  var k=Math.floor(n.title.length*avail/w)-1;return k<3?'':n.title.slice(0,k).replace(/\s+$/,'')+'…';
}
function drawWheel(){
  all.forEach(function(n){
    if(!n.wg)return;
    var d=n.wd,a0=n.wa0,a1=n.wa1;
    if(!(a1-a0>1e-4&&d>0.5&&d<RINGS+0.5)){if(n.wshow!==false){n.wg.style.display='none';n.wshow=false;}return;}
    var ri=Math.max(W.r0,W.r0+(d-1)*W.rw),ro=Math.min(W.R,W.r0+d*W.rw);
    if(ro-ri<1){n.wg.style.display='none';n.wshow=false;return;}
    if(n.wshow!==true){n.wg.style.display='';n.wshow=true;}
    var t0=a0*TAU,t1=a1*TAU,rel=Math.round(d),solid=n.depth<=2||rel===1;
    n.wp.setAttribute('d',sector(t0,t1,ri,ro));
    n.wp.style.fill=solid?n.acc:'color-mix(in srgb,'+n.acc+' '+(rel===2?40:22)+'%,var(--surface))';
    n.wg.classList.toggle('on',solid);
    /* label: along the arc when there is room, otherwise along the radius */
    var rm=(ri+ro)/2,len=(t1-t0)*rm,mid=(t0+t1)/2,deg=mid*180/Math.PI,along=len-10,radial=ro-ri-10;
    var tang='',rad='';
    if(ro-ri>=15){
      if(along>=radial&&along>20)tang=cut(n,solid,along);
      else if(len>=13)rad=cut(n,solid,radial);
    }
    if(tang){
      var bottom=deg>90&&deg<270,e=Math.min(t1-t0,TAU-1e-3);
      var s0=mid-e/2,s1=mid+e/2,L=e>Math.PI?1:0;
      n.wlp.setAttribute('d',bottom?'M'+pt(rm,s1)+'A'+rm+' '+rm+' 0 '+L+' 0 '+pt(rm,s0):'M'+pt(rm,s0)+'A'+rm+' '+rm+' 0 '+L+' 1 '+pt(rm,s1));
    }
    if(n.wtp.textContent!==tang)n.wtp.textContent=tang;
    if(n.wrt.textContent!==rad)n.wrt.textContent=rad;
    if(rad)n.wrt.setAttribute('transform','translate('+W.cx+' '+W.cy+') rotate('+(deg-90).toFixed(2)+') translate('+rm.toFixed(1)+' 0) rotate('+(deg<180?0:180)+')');
  });
}
function centreLabel(){
  var p=W.focus,g=wc.querySelector('.lab');g.textContent='';
  var bar=wc.querySelector('.bar');bar.setAttribute('x',W.cx-14);bar.style.fill=p.acc;
  var maxw=W.r0*1.55,words=p.title.split(' '),lines=[],cur='';
  mctx.font='650 14px system-ui,-apple-system,"Segoe UI",sans-serif';
  words.forEach(function(w){var t=cur?cur+' '+w:w;if(mctx.measureText(t).width>maxw&&cur){lines.push(cur);cur=w;}else cur=t;});
  lines.push(cur);lines=lines.slice(0,3);
  var sub=p.parent?'↑ back to '+p.parent.title:p.leafN+' topics';
  mctx.font='11.5px system-ui';if(mctx.measureText(sub).width>maxw)sub=p.parent?'↑ back':sub;
  var y0=W.cy-(lines.length*17)/2+4;
  bar.setAttribute('y',y0-22);
  lines.forEach(function(l,i){var t=document.createElementNS(SVGN,'text');t.setAttribute('class','t');t.setAttribute('x',W.cx);t.setAttribute('y',y0+i*17);t.textContent=l;g.appendChild(t);});
  var t=document.createElementNS(SVGN,'text');t.setAttribute('class','s');t.setAttribute('x',W.cx);t.setAttribute('y',y0+lines.length*17+4);t.textContent=sub;g.appendChild(t);
  wc.setAttribute('aria-label',p.parent?'Go up to '+p.parent.title:p.title);
}
function wheelPaint(){
  all.forEach(function(n){if(!n.wg)return;n.wg.classList.toggle('sel',n===selected);n.wg.classList.toggle('hit',!!n.hit);});
  all.forEach(function(n){if(n.wg&&n.hit)warcs.appendChild(n.wg);});
  if(selected&&selected.wg)warcs.appendChild(selected.wg);
}
function wheelFocus(p,instant){
  cancelAnimationFrame(W.raf);
  targets(p);W.focus=p;centreLabel();
  var st=all.map(function(n){return [n.wa0,n.wa1,n.wd];});
  var dur=(instant||reduce||document.hidden)?0:450,t0=performance.now();
  function frame(now){
    var k=dur?Math.min(1,(now-t0)/dur):1,e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    all.forEach(function(n,i){
      var s=st[i];if(s[0]==null){n.wa0=n.ta0;n.wa1=n.ta1;n.wd=n.td;return;}
      n.wa0=s[0]+(n.ta0-s[0])*e;n.wa1=s[1]+(n.ta1-s[1])*e;n.wd=s[2]+(n.td-s[2])*e;
    });
    drawWheel();
    if(k<1)W.raf=requestAnimationFrame(frame);
  }
  frame(t0);
}
if(window.ResizeObserver)new ResizeObserver(function(){if(view==='wheel'&&wheelSize())drawWheel();}).observe(wheel);
var vt=document.getElementById('vtree'),vw=document.getElementById('vwheel');
function setView(v){
  view=v;save('view',v);
  canvas.hidden=v!=='tree';wheel.hidden=v!=='wheel';
  document.querySelector('header .zoom').hidden=v!=='tree';document.getElementById('expand').hidden=v!=='tree';
  vt.setAttribute('aria-pressed',v==='tree');vw.setAttribute('aria-pressed',v==='wheel');
  if(v==='wheel'){
    wheelSize();
    var f=selected?(selected.children.length?selected:(selected.parent||root)):W.focus;
    wheelFocus(f,true);wheelPaint();
  }else{
    /* a map built while the tree was hidden has no widths yet */
    if(all.some(function(n){return !n.w;})){
      all.forEach(function(n){n.el.style.display='';});
      all.forEach(function(n){n.w=n.el.offsetWidth;});
      all.forEach(function(n){n.el.style.display=n.vis?'':'none';});
    }
    if(selected)for(var p=selected.parent;p;p=p.parent)p.open=true;
    update(null,selected||root,true);
  }
}
vt.addEventListener('click',function(){if(view!=='tree')setView('tree');});
var dv=document.getElementById('dvault'),dg=document.getElementById('dgaps');
function markData(){dv.setAttribute('aria-pressed',DATA==='vault');dg.setAttribute('aria-pressed',DATA==='gaps');document.body.classList.toggle('gaps',DATA==='gaps');}
function switchData(d){
  if(d===DATA)return;
  DATA=d;save('data',d);markData();
  cancelAnimationFrame(raf);cancelAnimationFrame(W.raf);clearTimeout(guard);
  Array.prototype.slice.call(stage.querySelectorAll('.node')).forEach(function(e){e.remove();});
  svg.textContent='';warcs.textContent='';wdefs.textContent='';
  parseAndBuild(outlineText());buildWheel();
  selected=null;q.value='';count.textContent='';size={w:0,h:0};W.focus=root;
  home();renderPanel();
  if(view==='wheel'){wheelSize();wheelFocus(root,true);wheelPaint();}
  else{update(null,null,true);canvas.scrollLeft=(root.tx+root.w/2)*Z-canvas.clientWidth/2;canvas.scrollTop=(root.ty+H/2)*Z-canvas.clientHeight/2;}
}
dv.addEventListener('click',function(){switchData('vault');});
dg.addEventListener('click',function(){switchData('gaps');});
markData();
vw.addEventListener('click',function(){if(view!=='wheel')setView('wheel');});

home();renderPanel();update(null,null,true);
canvas.scrollLeft=(root.tx+root.w/2)*Z-canvas.clientWidth/2;canvas.scrollTop=(root.ty+H/2)*Z-canvas.clientHeight/2;
if(load('view')==='wheel')setView('wheel');
})();
</script>
