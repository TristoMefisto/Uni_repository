<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Economics map</title>
<style>
:root{
  --bg:#f6f5f1;--surface:#ffffff;--ink:#1d2330;--muted:#667085;--line:#d9d6cd;--hit:#e0a800;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161b;--surface:#1e2129;--ink:#e9e7e2;--muted:#9aa3b2;--line:#363a46;--hit:#f2c230;
  }
  :root:not([data-theme="light"]) .node,:root:not([data-theme="light"]) .link{--accs:color-mix(in srgb,var(--acc) 60%,#fff)}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
header .meta{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
header .sp{flex:1}
header input{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:210px;max-width:100%}
header button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
header button:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{flex:1;min-height:0;display:flex}
#canvas{flex:1;min-width:0;overflow:auto;cursor:grab;position:relative}
#canvas.drag{cursor:grabbing;user-select:none}
#stage{position:relative}
#links{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.link{fill:none;stroke:var(--accs);stroke-width:1.4;opacity:.5;--accs:var(--acc)}
.node{--accs:var(--acc);position:absolute;left:0;top:0;height:28px;padding:0 10px;display:flex;align-items:center;gap:8px;
  border:1px solid color-mix(in srgb,var(--accs) 40%,var(--line));border-radius:8px;
  background:color-mix(in srgb,var(--acc) 10%,var(--surface));color:var(--ink);
  font:500 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;white-space:nowrap;cursor:pointer;will-change:transform}
.node:hover{border-color:var(--accs)}
.node.leaf{background:var(--surface);border-left:3px solid var(--accs)}
.node.L{flex-direction:row-reverse}
.node.leaf.L{border-left:1px solid color-mix(in srgb,var(--accs) 40%,var(--line));border-right:3px solid var(--accs)}
.node.d0{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:650;font-size:14px}
.node.d1{background:var(--surface);border:1.5px solid var(--ink);font-weight:650;font-size:14px}
.node.d2{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.node.placeholder{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.node .n{font-size:11px;font-weight:600;min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:9px;text-align:center;
  background:color-mix(in srgb,var(--accs) 20%,transparent);font-variant-numeric:tabular-nums}
.node.d0 .n,.node.d2 .n{background:rgba(255,255,255,.24)}
.node.open .n{opacity:.45}
.node.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.node.hit{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--hit)}
#grip{flex:none;width:7px;cursor:col-resize;background:var(--line);opacity:.55;touch-action:none}
#grip:hover,#grip.on{opacity:1;background:var(--muted)}
[hidden]{display:none!important}
header .seg{display:inline-flex}
header .seg button{border-radius:0;margin-left:-1px}
header .seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
header .seg button:last-child{border-radius:0 8px 8px 0}
header button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#wheel{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden}
#wsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.arc{cursor:pointer;outline:none}
.arc path{stroke:var(--bg);stroke-width:1;fill-rule:evenodd}
.arc:hover path{filter:brightness(1.08)}
.arc text{font:500 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink);pointer-events:none}
.arc.on text{fill:#fff;font-weight:600}
.arc.sel path,.arc:focus-visible path{stroke:var(--ink);stroke-width:2.5}
.arc.hit path{stroke:var(--hit);stroke-width:3}
#wcenter{cursor:pointer}
#wcenter circle{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
#wcenter text{fill:var(--ink);text-anchor:middle;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#wcenter .t{font-size:14px;font-weight:650}
#wcenter .s{font-size:11.5px;fill:var(--muted)}
#panel{width:var(--pw,340px);flex:none;border-left:1px solid var(--line);background:var(--surface);padding:18px 18px 28px;overflow:auto}
#panel .crumbs{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.6}
#panel .crumbs button{all:unset;cursor:pointer;color:var(--muted)}
#panel .crumbs button:hover{color:var(--ink);text-decoration:underline}
#panel h2{font-size:19px;line-height:1.25;margin:0 0 12px;letter-spacing:-.01em;text-wrap:balance}
#panel h2::before{content:"";display:block;width:28px;height:4px;border-radius:2px;background:var(--pacc,var(--ink));margin-bottom:10px}
#panel .jel{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin:6px 0 2px}
body.gaps .node:not(.d0){border-style:dashed}
body.gaps .node.d2{background:transparent;color:var(--ink);border:1.5px dashed var(--acc)}
#panel .desc{margin:0 0 4px;font-size:14.5px;line-height:1.55}
#panel ul{margin:0 0 4px;padding-left:18px}
#panel li{margin:5px 0}
#panel .lab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 8px;font-weight:600}
#panel .chips{display:flex;flex-wrap:wrap;gap:6px}
#panel .chips button{font:inherit;font-size:12.5px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
#panel .chips button:hover{border-color:var(--muted)}
#panel .rel button{border-left:3px solid var(--acc);text-align:left}
#panel .rel small{color:var(--muted);font-size:11px;margin-left:6px}
header .zoom{display:inline-flex}
header .zoom button{border-radius:0;margin-left:-1px;min-width:32px;font-variant-numeric:tabular-nums}
header .zoom button:first-child{border-radius:8px 0 0 8px;margin-left:0}
header .zoom button:last-child{border-radius:0 8px 8px 0}
#panel a{display:block;color:var(--ink);font-size:13px;margin:5px 0;text-underline-offset:3px}
#panel .empty{color:var(--muted)}
@media (max-width:760px){
  main{flex-direction:column}
  #grip{display:none}
  #panel{width:auto;border-left:0;border-top:1px solid var(--line);max-height:42%;padding:14px 16px 20px}
  header input{width:100%;order:5}
  header .sp{flex-basis:100%;height:0}
}
</style>
</head>
<body>
<header>
  <h1>Economics map</h1>
  <span class="meta" id="meta"></span>
  <span class="sp"></span>
  <span class="meta" id="count" aria-live="polite"></span>
  <span class="seg" role="group" aria-label="Map"><button id="dvault" type="button" aria-pressed="true">In vault</button><button id="dgaps" type="button" aria-pressed="false">Not covered</button></span>
  <span class="seg" role="group" aria-label="View"><button id="vtree" type="button" aria-pressed="true">Tree</button><button id="vwheel" type="button" aria-pressed="false">Wheel</button></span>
  <input id="q" type="search" placeholder="Search topics" aria-label="Search topics">
  <span class="zoom"><button id="zout" type="button" aria-label="Zoom out">−</button><button id="zlabel" type="button" title="Reset zoom to 100%">100%</button><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zfit" type="button" title="Fit the open map in the window">Fit</button></span>
  <button id="expand" type="button">Expand all</button>
  <button id="collapse" type="button">Collapse</button>
</header>
<main>
  <div id="canvas"><div id="stage"><svg id="links" aria-hidden="true"></svg></div></div>
  <div id="wheel" hidden><svg id="wsvg" role="img" aria-label="Wheel view of the map"><defs id="wdefs"></defs><g id="warcs"></g><g id="wcenter" role="button" tabindex="0" aria-label="Go up one level"><circle></circle><rect class="bar" width="28" height="4" rx="2"></rect><g class="lab"></g></g></svg></div>
  <div id="grip" role="separator" aria-orientation="vertical" aria-label="Resize the side panel" tabindex="0"></div>
  <aside id="panel" aria-live="polite"></aside>
</main>

<!--
  The map is the outline below. Two spaces per level.
  "> text"  is the description shown in the side panel
  "- text"  adds a key point to the node above
  "~ Title" links the node to a related one (use "Parent / Title" if the title is not unique); shown in the panel only
  "@ path"  sets the vault page of the node above (inherited by its children)
  "! placeholder" marks an empty branch
-->
<script type="text/plain" id="outline">
Economics and econometrics
  > The whole map: economic theory and policy on the left, the empirical toolbox on the right. Everything here comes from pages in the vault.
  Economics
    > The theory and policy side: how markets work, where they fail, what governments do about it, and how economies are measured.
    Microeconomics
      > How consumers and firms choose and how their choices meet in a market. It is the benchmark every later field departs from.
      Supply and demand
        > The basic market model: two curves, one price. It is the starting point for every partial-equilibrium argument in the map.
        @ UNITE/Microeconomia/Pages/00. Basi, domanda e offerta
        Demand and supply curves
          > Demand relates price to the quantity buyers want, supply to the quantity sellers offer. A price change moves us along a curve, anything else shifts it.
          - Quantity demanded falls with price, quantity supplied rises
          - Movement along a curve vs shift of the curve
        Market equilibrium
          > The price at which the two quantities coincide. Away from it, shortages or surpluses push the price back.
          - Price at which quantity demanded = quantity supplied
          - Excess demand or supply pushes the price back
      Elasticity
        > How strongly a quantity reacts to a price, in percentage terms. It decides who bears a tax and how large the distortion is.
        @ UNITE/Microeconomia/Pages/01. Elasticità
        @ Concepts/Concept pages/Elasticità · Elasticity
        Demand elasticity
          > The percentage fall in quantity demanded after a 1% price rise. It tells us whether raising the price raises or lowers revenue.
          ~ Partial equilibrium
          ~ Ramsey rule
          ~ Monopoly pricing
          ~ Excess burden
          ~ Logs
          - ε = %ΔQ / %ΔP
          - Elastic if |ε| > 1
          - Revenue rises with price only if demand is inelastic
        Supply elasticity
          > The percentage rise in quantity supplied after a 1% price rise. It is low in the short run and higher once firms can adjust capacity.
          - % change in quantity supplied / % change in price
      Consumer theory
        > The consumer picks the best affordable bundle given preferences and a budget. Demand curves are the result of this choice.
        @ UNITE/Microeconomia/Pages/02. Preferenze e scelta del consumatore
        Preferences
          > Rankings over bundles, drawn as indifference curves. Their slope, the marginal rate of substitution, is the consumer's own trade-off between two goods.
          - Indifference curves
          - MRS: how much of one good is given up for another
        Budget line
          > All bundles that cost exactly the available income. Its slope is the market's trade-off between two goods, the price ratio.
          - p1·x1 + p2·x2 = m
          - Slope −p1 / p2
        Optimal choice
          > The bundle where the highest reachable indifference curve touches the budget line, so the personal and the market trade-off coincide.
          - Tangency: MRS = price ratio
        Price- and income-consumption curves
          > We trace the optimal bundle while one price or income changes. The first exercise delivers the demand curve of the good.
          - Optimal bundles as a price or income changes
          - The price curve gives the demand curve
        Normal and inferior goods
          > A good is normal if we buy more of it when income rises and inferior if we buy less.
          - Normal: demand rises with income
          - Inferior: it falls
        Marshallian vs Hicksian demand
          > Two demand curves for the same good: one holds income fixed, the other holds utility fixed. Only the second isolates the substitution effect, which is what exact welfare measures need.
          ~ Marshallian surplus
          ~ Willingness to pay
          @ UNIBO/Cost-benefit analysis (PE2)/Pages/03. Theoretical tools for CBA
          - Marshallian: income held fixed
          - Hicksian: utility held fixed, substitution effect only
      Production and costs
        > How firms turn inputs into output and what that costs. The cost curves are what the supply side of the market is built on.
        @ UNITE/Microeconomia/Pages/03. Produzione e costi
        Technology
          > The production function gives the most output obtainable from given inputs. Adding more of one input alone eventually yields less and less.
          - Production function
          - Marginal product and diminishing returns
        Two variable inputs
          > With labour and capital both adjustable, isoquants show the input mixes for a given output. The firm picks the cheapest mix.
          - Isoquants
          - Cost minimisation: MRTS = input price ratio
        Cost functions
          > The least cost of producing each output level. Average and marginal cost curves follow from it and drive the supply decision.
          - Fixed and variable, average and marginal cost
          - MC crosses AC at its minimum
      Competitive markets
        > Many price-taking firms and free entry. The outcome is the efficiency benchmark against which taxes and market power are judged.
        @ UNITE/Microeconomia/Pages/04. Profitti e mercati concorrenziali
        Profit maximisation
          > A price taker produces until the last unit costs exactly the price. This rule turns the marginal cost curve into the supply curve.
          - Price taker: P = MC
          - Supply: the MC curve above minimum average variable cost
        Short and long run
          > In the short run the number of firms is fixed and profits can be positive. In the long run entry and exit remove them.
          - Long run: entry drives profits to zero
          - P = minimum average cost
        Aggregate surplus
          > The gains from trade in a market, split between buyers and sellers. Perfect competition makes this sum as large as possible.
          ~ Social surplus
          ~ Marshallian surplus
          - Consumer + producer surplus
          - Largest at the competitive equilibrium
        Taxes on goods
          > A tax separates the price buyers pay from the price sellers keep. Fewer units are traded and part of the surplus is lost.
          ~ Partial equilibrium
          ~ Excess burden
          @ UNITE/Microeconomia/Pages/05. Interventi sul mercato
          - Wedge between the buyer and the seller price
          - Deadweight loss
      Monopoly
        > A single seller facing the whole demand curve. It sets price above marginal cost, which is the textbook case of market power.
        @ UNITE/Microeconomia/Pages/06. Monopolio e discriminazione di prezzo
        Monopoly pricing
          > The monopolist restricts quantity until marginal revenue equals marginal cost. The less elastic the demand, the higher the markup.
          ~ Allocative inefficiency
          ~ Tax incidence / Monopoly
          ~ Measuring market power
          ~ Double marginalisation
          - MR = MC, price above marginal cost
          - Markup falls as demand gets more elastic
        Price discrimination
          > Charging different prices for the same good to capture more surplus: person by person, by quantity bought, or by group.
          - First, second and third degree
      Oligopoly
        > A few firms whose profits depend on each other's choices. The outcome depends on whether they compete in quantities or in prices.
        @ UNITE/Microeconomia/Pages/07. Teoria dei giochi e oligopolio
        Cournot
          > Firms pick quantities at the same time, each taking the rival's output as given. Price ends up between the monopoly and the competitive level.
          ~ Unilateral effects
          ~ Nash equilibrium
          - Firms choose quantities
          - Outcome between monopoly and competition
        Bertrand
          > Firms pick prices instead of quantities. With identical goods, undercutting drives the price down to marginal cost even with two firms.
          ~ Nash equilibrium
          ~ Incentive to cheat
          - Firms choose prices
          - Homogeneous goods: price falls to marginal cost
      Welfare economics
        > The criteria we use to say that one allocation is better than another, and what markets can and cannot guarantee.
        @ Concepts/Concept pages/Surplus ed efficienza · Welfare, surplus and efficiency
        Pareto efficiency
          > An allocation is efficient if nobody can be made better off without hurting someone else. It says nothing about fairness.
          ~ Prisoner's dilemma
          ~ Efficiency criterion
          @ UNIBO/Foundations (PE1)/Pages/01. Competition and efficiency
          - Nobody can gain without someone losing
        First welfare theorem
          > Under perfect competition and no market failures, the market outcome is Pareto efficient. It is the formal version of the invisible hand.
          ~ Why intervene
          @ UNIBO/Foundations (PE1)/Pages/01. Competition and efficiency
          - A competitive equilibrium is Pareto efficient
          - The invisible hand, absent market failures
        Second welfare theorem
          > Any efficient allocation can be reached by the market once initial resources are redistributed with lump-sum transfers. Efficiency and equity can be separated in principle.
          ~ Lump-sum taxes
          @ UNITE/Politica Economica/Pages/02. Economia del benessere
          - Any efficient allocation can be reached with lump-sum transfers
        Old and new welfare economics
          > The old school summed utilities across people. The new one refuses interpersonal comparisons and relies on the Pareto principle alone.
          @ UNITE/Politica Economica/Pages/02. Economia del benessere
          - Old: cardinal utility, comparable across people
          - New: ordinal utility and the Pareto principle
        Arrow's impossibility theorem
          > There is no rule that turns individual rankings into a social ranking while respecting a short list of reasonable conditions, unless one person decides.
          ~ Voting theory
          @ UNITE/Politica Economica/Pages/02. Economia del benessere
          - No social ordering meets all of Arrow's axioms
          - Unless one person dictates
    Game theory and bargaining
      > Choices when the outcome depends on what others do, and how this helps us read real negotiations.
      @ Concepts/Concept pages/Teoria dei giochi · Game theory
      Simultaneous games
        > Players move without seeing each other's choice. The tool is the best response, the solution is the Nash equilibrium.
        @ UNIBO/Negotiation And Bargaining/Pages/01. Game theory foundations
        Nash equilibrium
          > A profile of strategies from which nobody wants to move alone. A game can have none in pure strategies, one, or several.
          - Every strategy is a best response to the others
        Prisoner's dilemma
          > Each player does better by defecting whatever the other does, so both defect and both lose. Individual rationality defeats the common interest.
          ~ Incentive to cheat
          ~ Repeated games
          - Defecting is dominant
          - The equilibrium is Pareto inefficient
        Social dilemmas
          > The prisoner's dilemma with many players: overuse of a common resource, underfunding of a public good.
          ~ Private provision
          ~ Definition
          - Tragedy of the commons
          - Public goods and free riding
        Coordination games
          > Players want to match each other but there are several ways to do it. Which equilibrium is played depends on expectations and trust.
          - Several equilibria
          - Stag hunt: the efficient one is the risky one
        Anti-coordination games
          > Each player is better off doing the opposite of the other. The conflict is over who takes which role.
          - Players gain by choosing different actions
      Sequential games
        > Players move in turns and see what came before. We solve them from the end, by backward induction.
        @ UNIBO/Negotiation And Bargaining/Pages/02. Sequential games and social preferences
        Ultimatum game
          > One player proposes a split and the other accepts or refuses. Real responders reject unfair offers, against the standard prediction.
          - Theory: accept any positive offer
          - In practice low offers are rejected
        Structured bargaining
          > Offers and counter-offers alternate while the amount to share shrinks every round. Delay is costly, so agreement should come immediately.
          ~ ZOPA
          - Offers alternate while the endowment erodes
          - Solved by backward induction
        Social preferences
          > People care about fairness and about others' payoffs, not only their own. Adding this to utility explains what we observe in the lab.
          - Fairness, reciprocity, altruism
          - Enter the utility function
      Behavioural insights
        > Systematic departures from full rationality that matter at the bargaining table.
        @ UNIBO/Negotiation And Bargaining/Pages/03. Behavioral economics and the psychology of first offers
        Bounded rationality
          > We decide with limited information, time and attention, so we use rules of thumb. These work most of the time and fail predictably.
          ~ Frictions
          - Limited information, time and computation
          - Heuristics instead of optimisation
        First offers and anchoring
          > The first number on the table becomes the reference for everything that follows. This is why opening first can pay.
          ~ Reservation and target price
          - The first number pulls the final outcome
        Framing
          > The same deal is judged differently when presented as a gain or as a loss, because losses weigh more.
          - Same outcome, different choice as a gain or as a loss
        Endowment effect and status quo bias
          > We ask more to give something up than we would pay to get it, and we stick to the current situation.
          @ UNIBO/Negotiation And Bargaining/Pages/04. Distributive bargaining and BATNA
          - What we own is valued more
        Cognitive and motivational biases
          > Two families of errors: mistakes in how we process information, and distortions that come from what we want to believe.
          @ UNIBO/Negotiation And Bargaining/Pages/05. Cognitive and motivational biases in negotiation
          - Cognitive: systematic errors in processing information
          - Motivational: distortions from goals and self-image
      Negotiation
        > The practical toolkit: how to prepare, where the room for agreement is, and how to enlarge it.
        @ UNIBO/Negotiation And Bargaining/Pages/04. Distributive bargaining and BATNA
        BATNA
          > What we do if the negotiation fails. The better the alternative, the stronger our position.
          - Best alternative to a negotiated agreement
          - Sets the walk-away point
        Reservation and target price
          > The reservation price is the limit beyond which we walk away. The target is the ambitious but realistic result we aim for.
          - Reservation: the worst deal still accepted
          - Target: the deal aimed for
        ZOPA
          > The range of deals both sides prefer to no deal. Bargaining is about where inside this range we end up.
          - Zone between the two reservation prices
          - No overlap, no deal
        Integrative negotiation
          > Instead of splitting a fixed amount, we look for trades across issues that the parties value differently. Both sides can gain.
          @ UNIBO/Negotiation And Bargaining/Pages/06. Creating value and integrative negotiation
          - Interests, not positions
          - Turn one issue into several, then logroll
        Multi-party negotiation
          > With more than two parties, coalitions form and the process itself has to be managed.
          @ UNIBO/Negotiation And Bargaining/Pages/07. Multi-party negotiations
          - Coalitions
          - Managing the group process
    Household economics
      > How decisions are taken inside a household and who gets what. It is the framework behind your FEX project.
      @ UNIBO/Field experiments/FEX project dossier
      ~ Game theory and bargaining
      Household models
        > Three ways to model a household with more than one decision-maker.
        @ UNIBO/Field experiments/Material/Papers/Companion notes/Baland & Ziparo (2018) Intra-Household Bargaining in Poor Countries
        Unitary model
          > The household acts as one person with one set of preferences, so it does not matter who earns the money.
          - Income pooling: only total income counts
          - Rejected when money paid to women is spent differently
        Collective model
          > Spouses reach an efficient outcome, and bargaining power decides how the gains are shared.
          - Decisions are Pareto efficient
          - Weights depend on outside options
          ~ Pareto efficiency
        Non-cooperative model
          > Each spouse chooses separately, taking the other's choices as given, so the outcome can be inefficient.
          ~ Nash equilibrium
        Limited commitment
          > Spouses cannot commit to a deal, so it is renegotiated whenever one of them could do better outside it.
        Testing efficiency
          > Checking whether households really reach efficient outcomes, including extended families living with the husband's parents.
          @ UNIBO/Field experiments/Material/Papers/Companion notes/Gupta et al. (2021) Intra-household Efficiency in Extended Family Households
      Bargaining power
        > What decides whose preferences count more, and how it is measured.
        Outside options
          > What each spouse would get without the other. A better outside option means more weight in the household.
          ~ BATNA
        Control of resources
          > Who receives an income shapes how it is spent, against the unitary model.
          @ UNIBO/Field experiments/Material/Papers/Companion notes/Tommasi (2019) Control of Resources, Bargaining Power and the Demand of Food
        Resource shares
          > The share of household consumption each member gets, estimated from spending data.
          @ UNIBO/Field experiments/Material/Papers/Companion notes/Tommasi & Wolf (2018) Estimating household resource shares
        Decision-making indices
          > Survey questions on who has a say over spending or work, combined into a standardised index.
          @ UNIBO/Field experiments/FEX project dossier
      Information between spouses
        > Spouses often do not share what they know, and this changes household choices.
        Hiding income
          > Given the chance, spouses hide money from each other, a quarter of the time in Castilla's Uttarakhand experiment.
          @ UNIBO/Field experiments/Material/Papers/Companion notes/Castilla (2016) What's Yours is Mine, and What's Mine is Mine
        Observability
          > Choices change with what the spouse can see, depending on who controls the money.
          @ UNIBO/Field experiments/Material/Papers/Companion notes/Ashraf (2009) Spousal Control and Intra-Household Decision Making
        Knowledge of preferences
          > Spouses predict each other's preferences poorly.

    Competition policy
      > The rules that stop firms from reducing competition: when market power is a problem, how it is measured, and what the authorities can do. It is applied industrial organisation.

        > One outcome and one regressor. Everything about OLS can be seen here before adding variables.

          > The model for the average of y given x. The error term contains everything else that affects y.

          > The line that makes the squared prediction errors as small as possible. The slope is the sample covariance over the variance of x.
          - Minimises the sum of squared residuals

          > Algebraic facts that hold in every OLS fit, by construction, whatever the data.

          > The fraction of the sample variation in y that the regression accounts for. A low value does not make the estimates wrong.

          > Each coefficient can be obtained by first removing from the regressor what the other regressors explain. This is what "controlling for" means.

          ~ Double machine learning

          - High: larger variance, no bias
        Omitted variable bias
          > Leaving out a variable that matters and is correlated with a regressor makes that regressor's coefficient absorb its effect.
          ~ Omitted variables
          ~ Unit effect
          ~ Double lasso
          - Bias = effect of the omitted variable × its link with x
          - The two signs give the direction
      Finite-sample properties
        > What we can say about OLS in a sample of any size, under the classical assumptions.
        @ UNIBO/Econometrics/Pages/03. Multiple linear regression
        Assumptions MLR.1-6
          > The classical assumptions. The first four give unbiasedness, the fifth the variance formula, the sixth exact tests.
          ~ Assumptions FD.1-6
          - 1-3: linear in parameters, random sampling, no perfect collinearity
          - 4: zero conditional mean, E[u|x] = 0
          - 5: homoskedasticity; 6: normality
        Unbiasedness
          > Across repeated samples OLS is right on average. The key requirement is that the error is unrelated to the regressors.
          - E[β̂] = β under MLR.1-4
        Sampling variance
          > How much the estimate varies across samples. It falls with more data and more variation in the regressor, and rises with collinearity.
          - Var(β̂j) = σ² / [SSTj·(1 − Rj²)]
          - σ̂² = SSR / (n − k − 1)
        Gauss-Markov
          > Under the first five assumptions no other linear unbiased estimator is more precise than OLS.
          ~ Heteroskedasticity
          ~ GLS
          - Under MLR.1-5 OLS is BLUE
      Asymptotics
        > What happens as the sample grows. It lets us drop the normality assumption.
        @ UNIBO/Econometrics/Pages/04 and 05. Statistical Inference
        Consistency
          > With enough data the estimate gets arbitrarily close to the truth. It requires only that the error and the regressors are uncorrelated.
          - plim β̂ = β if Cov(x, u) = 0
          - Weaker than zero conditional mean
        Asymptotic normality
          > In large samples the estimator is approximately normal whatever the error distribution, so the usual tests remain valid.
          - β̂ approximately normal in large samples
          - Normality of u is no longer needed
      Inference
        > Testing hypotheses and building intervals for regression coefficients.
        @ UNIBO/Econometrics/Pages/04 and 05. Statistical Inference
        t tests
          > The standard test on one coefficient, most often of whether it is zero.
          - t = β̂j / se(β̂j), with n − k − 1 df
          - One- and two-sided alternatives
        Confidence intervals
          > The range of coefficient values that a two-sided test would not reject.
          - β̂j ± c·se(β̂j)
        Linear restrictions
          > Tests that involve more than one coefficient in a single equation, such as whether two effects are equal.
          - e.g. H0: β1 = β2
          - t test on the combination, or reparametrise
        F test
          > The joint test that a group of coefficients are all zero. It compares the fit with and without them.
          - F = [(SSRr − SSRur) / q] / [SSRur / (n − k − 1)]
          - Also in R² form
      Specification
        > Choices about how variables enter the model.
        @ UNIBO/Econometrics/Pages/06. Additional topics
        Logs
          > Taking logarithms turns coefficients into percentage effects and often makes relations closer to linear.
          - Log-lin: 100·β ≈ % change in y per unit of x
          - Log-log: β is an elasticity
        Quadratics
          > Adding the square of a regressor lets its effect rise or fall with its level.
          ~ Polynomials
          - Marginal effect depends on x
          - Turning point: x* = −β̂1 / (2·β̂2)
        Dummies and interactions
          > Binary variables let groups have different intercepts. Interacted with a regressor, they let the slope differ too.
          ~ Regression DiD
          ~ Treatment heterogeneity
          - Dummy: shifts the intercept
          - Interaction: shifts the slope
          - g categories need g − 1 dummies
        Adjusted R²
          > A version of R² that rewards a new regressor only if it improves the fit enough.
          ~ Cp, AIC, BIC
          - Penalises extra regressors
          - Can fall when a variable is added
        Units of measurement
          > Changing the units of a variable rescales its coefficient but nothing of substance.
          @ UNIBO/Econometrics/Pages/01 and 02. Simple linear regression
          - Rescaling changes coefficients, not fit or t statistics
      Error structure
        > What to do when the errors do not have constant variance or are correlated.
        @ UNIBO/Econometrics/Pages/06. Additional topics
        Heteroskedasticity
          > The spread of the error changes with the regressors. Estimates stay valid, the usual standard errors do not.
          ~ Linear probability model
          - Var(u|x) is not constant
          - OLS still unbiased, usual SE wrong
        Robust (White) SE
          > Standard errors that remain valid whatever the pattern of error variances. They are the default in applied work.
          - Valid under any form of heteroskedasticity
          - Large-sample justification
        Clustered SE
          > Standard errors that allow observations in the same group to share shocks. Ignoring this overstates precision.
          ~ Serial correlation
          ~ Clustering
          @ UNIBO/Econometrics/Pages/08 and 09. Panel data methods
          - Allow correlation inside groups (a unit over time, a village)
    Estimation beyond OLS
      > Other estimation principles, for when least squares is not available or not enough.
      @ Concepts/Math refresher/09. Estimation methods beyond OLS
      Maximum likelihood
        > We choose the parameter values that make the observed data most probable under an assumed distribution.
        ~ Logit
        ~ Probit
        - Pick θ that maximises the log-likelihood
        - Consistent, asymptotically normal and efficient if the model is right
        - Estimates logit and probit
      Generalised method of moments
        > Estimation from conditions that should hold on average in the population. It needs no full distributional assumption.
        ~ 2SLS
        - Match sample moments to E[g(θ)] = 0
        - OLS and IV are special cases
        - Over-identified: a weighting matrix
      GLS
        > Least squares on data transformed so that the errors become well behaved. More efficient than OLS when the error structure is known.
        ~ GLS estimation
        @ UNIBO/Econometrics/Pages/08 and 09. Panel data methods
        - Reweights when errors are not spherical
        - Used for random effects
      Penalised regression
        > Least squares with a cost on large coefficients. It trades a little bias for much less variance.
        ~ Ridge
        ~ Lasso
        - OLS plus a penalty on coefficient size
        - Ridge (L2) and lasso (L1)
      Kernel regression
        > Estimating a relation without assuming its shape, by averaging nearby observations.
        ~ Local regression
        ~ Kernel
        ~ Non-parametric estimation
        - Local weighted average of y around x
        - Bandwidth h trades bias for variance
    Limited dependent variables
      > Models for outcomes that are binary, categorical or observed only for a selected group.
      Binary response
        > Models for a yes/no outcome, where what we estimate is a probability.
        @ UNIBO/Econometrics/Pages/07. Binary response models
        Linear probability model
          > Plain OLS with a binary outcome. Simple to read, and usually fine for average effects.
          - OLS on a 0/1 outcome, β = change in P(y = 1)
          - Fitted values can leave [0, 1]
          - Heteroskedastic by construction
        Logit
          > A model that keeps predicted probabilities between 0 and 1 by using the logistic function.
          ~ Logistic regression
          ~ Propensity score
          - P(y = 1|x) = Λ(xβ), logistic cdf
          - Estimated by maximum likelihood
        Probit
          > The same idea as logit with the normal distribution. Results are almost always very close.
          - P(y = 1|x) = Φ(xβ), normal cdf
        Latent variable
          > We imagine an unobserved continuous index and see only whether it crosses a threshold.
          ~ Endogenous dummy model
          - y* = xβ + ε, y = 1 if y* > 0
          - Logit vs probit: the distribution of ε
        Partial effects
          > In logit and probit the effect of a regressor on the probability depends on where we evaluate it, so we report an average.
          - PEA: at the average x
          - APE: averaged over the observations
          - APE is what compares with LPM coefficients
        Goodness of fit
          > How to judge the fit of a binary model, where the usual R² does not apply.
          - Percent correctly predicted
          - Pseudo R²
      Multinomial logit
        > The extension of logit to outcomes with several unordered categories.
        ~ Multinomial logistic
        ~ Softmax and cross-entropy
        @ UNIBO/Machine learning/Pages/02. Regression and classification
        - More than two unordered outcomes
        - One coefficient vector per class against a baseline
      Selection models
        > Models for when the treated, or the observed, are not a random subset because they chose to be there.
        ~ Naive estimator
        @ Concepts/Econometrics topics/01. Selection models and the Heckman correction
        Endogenous dummy model
          > A treatment indicator that is correlated with the error because people choose treatment on things we do not see.
          ~ Relevance and exclusion
          - Treatment dummy correlated with the error
          - Selection on unobservables
        Switching regression
          > Each person has two potential outcome equations, and a third equation decides which one we observe.
          - Separate outcome equations for treated and untreated
        Truncated normal
          > The mean of a normal variable given that it exceeds a threshold. It supplies the correction term in selection models.
          - E[u | u > c] = σ·λ(·)
          - λ: the inverse Mills ratio
        Heckman two-step
          > We first model who is selected, then add the implied correction term to the outcome regression.
          ~ Control functions
          - Step 1: probit for selection
          - Step 2: outcome regression plus the inverse Mills ratio
          - Without an exclusion restriction it rests on functional form
    Panel data
      > The same units observed over several periods. It lets us remove everything about a unit that does not change.
      @ UNIBO/Econometrics/Pages/08 and 09. Panel data methods
      Pooled OLS
        > Treating all unit-period observations as one cross-section.
        Unit effect
          > The unobserved, time-constant part of each unit. If related to the regressors, pooled OLS is biased.
          - Ignores the unit effect ai
          - Biased if ai is correlated with x
        Serial correlation
          > Observations of the same unit over time are not independent, so standard errors must be adjusted.
          - Errors of the same unit are correlated over time
          - Cluster the SE by unit
      First differences
        > Estimating on changes between periods instead of levels.
        FD estimator
          > Subtracting the previous period removes anything constant within the unit.
          ~ 2×2
          ~ DD with a baseline
          - Δy = Δx·β + Δu removes ai
          - With T = 2 it equals fixed effects
        Assumptions FD.1-6
          > The assumptions under which the first-difference estimator is unbiased and its usual inference valid.
          - Strict exogeneity (FD.4)
          - Needs variation in Δx
      Fixed effects
        > The estimator that uses only variation within each unit over time.
        Within transformation
          > Each variable is measured as a deviation from the unit's own average. The unit effect disappears.
          ~ Regression DiD
          - Demean by unit: ai drops out
          - So do time-constant regressors
        LSDV
          > The same fixed-effects estimates obtained by including an indicator for every unit.
          - One dummy per unit
          - Same β̂ as the within estimator
        Strict exogeneity
          > The assumption that current shocks are unrelated to past, present and future values of the regressors.
          ~ Parallel trends
          - u uncorrelated with x in every period
          - Rules out feedback from y to future x
      Random effects
        > An estimator that also uses the variation between units, valid under a stronger assumption.
        RE assumption
          > The unit effect must be unrelated to the regressors. If so, we need not throw away the between variation.
          - ai uncorrelated with x
          - More efficient than FE if it holds
        GLS estimation
          > Random effects subtracts only a fraction of the unit mean, the fraction depending on how important the unit effect is.
          - Quasi-demeaning
          - Keeps time-constant regressors
      Hausman test
        > A comparison of fixed and random effects estimates. If they differ systematically, the random effects assumption fails.
        - H0: RE and FE are both consistent
        - Rejection: use FE
    Causal inference
      > Methods for estimating the effect of a policy or treatment, as opposed to a correlation.
      Potential outcomes
        > The framework that defines a causal effect as the difference between what happens with and without treatment.
        @ UNIBO/Econometric methods for policy evaluation/Pages/01. The problem of causality
        @ UNIBO/Field experiments/Pages/01. Identification and estimation of the ATE
        Fundamental problem
          > We never see the same unit both treated and untreated. Every method is a way of filling in the missing outcome.
          - Only one of Y(1), Y(0) is observed per unit
          - Causal inference as a missing data problem
        ATE, ATT, ATU
          > Average effects over different groups: everyone, those who got the treatment, those who did not.
          ~ LATE
          ~ Heterogeneous effects
          - ATE = E[Y(1) − Y(0)]
          - ATT: on the treated; ATU: on the untreated
        Naive estimator
          > Comparing treated and untreated as they are. It mixes the effect with the pre-existing differences between the groups.
          ~ Difference in means
          - Difference in observed means
          - = ATT + selection bias
        SUTVA
          > The assumption that one unit's outcome does not depend on who else is treated.
          ~ Spillovers
          - No interference between units
          - One version of the treatment
        Independence
          > Treatment is unrelated to potential outcomes. When it holds, a simple comparison gives the causal effect.
          ~ Unconfoundedness
          ~ Field experiments
          - (Y(1), Y(0)) ⊥ D
          - Guaranteed by random assignment
      Endogeneity
        > The reasons a regressor can be correlated with the error, so that OLS does not give a causal effect.
        @ UNIBO/Econometric methods for policy evaluation/Pages/02 & 03. Causality and quasi-randomization
        Omitted variables
          > A third factor drives both the treatment and the outcome.
          - A confounder moves both x and y
        Reverse causality
          > The outcome affects the treatment as well as the other way round.
          - y also causes x
        Measurement error
          > A regressor recorded with noise makes its estimated effect smaller than the true one.
          - Classical error in x: attenuation toward zero
        Bad controls
          > Controls that are themselves outcomes of the treatment. Including them biases the estimate.
          ~ Covariates and precision
          @ UNIBO/Field experiments/Pages/03. Covariates and multiple treatments
          - Variables affected by the treatment
          - Controlling for them undoes randomization
      Randomized experiments
        > The researcher assigns treatment by chance, which makes the groups comparable by construction.
        @ UNIBO/Field experiments/Field experiments course page
        Types
          > The spectrum from experiments provided by nature to those run in the lab.
          @ UNIBO/Field experiments/Pages/00. What is a field experiment
          Natural experiments
            > Situations where some event or rule assigned treatment in a way that is as good as random.
            ~ Quasi-randomization
            - Assignment by nature or policy, as good as random
          Lab experiments
            > Experiments in a controlled environment. Clean, but behaviour may differ from real life.
            - Full control, low realism
          Field experiments
            > Randomized trials run with real people in their usual setting.
            - Randomization in a real setting
        Estimation
          > How to compute the treatment effect once the experiment has been run.
          Difference in means
            > The basic estimator of an experiment: average outcome of the treated minus that of the controls.
            @ UNIBO/Field experiments/Pages/01. Identification and estimation of the ATE
            - ȳT − ȳC
            - Unbiased for the ATE under random assignment
            - Same as OLS on a treatment dummy
          Covariates and precision
            > Adding pre-treatment variables does not change what we estimate but makes the estimate more precise.
            @ UNIBO/Field experiments/Pages/03. Covariates and multiple treatments
            - Baseline covariates cut residual variance
            - The estimand does not change
          Treatment heterogeneity
            > Whether the effect differs across groups defined before treatment.
            @ UNIBO/Field experiments/Pages/03. Covariates and multiple treatments
            - Treatment × baseline covariate interactions
          DD with a baseline
            > Comparing changes from the baseline instead of final levels.
            ~ 2×2
            @ UNIBO/Field experiments/Pages/04. Multiple periods
            - Change in treated − change in controls
            - Pays off only with high autocorrelation
          ANCOVA
            > Regressing the final outcome on treatment and the baseline outcome. Usually the most precise of the three estimators.
            @ UNIBO/Field experiments/Pages/04. Multiple periods
            - Controls for the baseline outcome
            - More power than DD when autocorrelation is low
        Inference
          > How to quantify uncertainty in an experiment.
          @ UNIBO/Field experiments/Pages/02. Statistical inference
          Standard errors
            > The precision of the difference in means and why the usual formula errs on the safe side.
            - SE of the difference in means
            - Conservative SE: the covariance of potential outcomes is never observed
          Randomization inference
            > A test built only on the random assignment, with no distributional assumptions.
            - Sharp null: no effect for any unit
            - Re-draw the assignment many times
            - p-value: share of draws at least as extreme
          Multiple testing
            > Testing many outcomes makes false discoveries likely. The p-values need to be adjusted.
            @ UNIBO/Field experiments/Pages/03. Covariates and multiple treatments
            - Many outcomes inflate false positives
            - Bonferroni and FWER
            - FDR: Anderson's sharpened q-values
        Design
          > Choices made before running the experiment.
          Blocking
            > Units are grouped by characteristics first and randomized within each group.
            @ UNIBO/Field experiments/Pages/02. Statistical inference
            - Randomize inside strata
            - Better balance and precision
          Clustering
            > Whole groups, such as villages or schools, are assigned together.
            @ UNIBO/Field experiments/Pages/02. Statistical inference
            - Randomize groups, not individuals
            - Intra-cluster correlation cuts the effective sample
          Balance tests
            > Checks that treatment and control groups look alike before treatment.
            ~ Validity checks
            ~ Propensity score
            @ UNIBO/Field experiments/Pages/03. Covariates and multiple treatments
            - Normalized differences
            - Joint orthogonality test
            - Kolmogorov-Smirnov
          Multiple treatments
            > Experiments with more than one treatment arm, including combinations.
            @ UNIBO/Field experiments/Pages/03. Covariates and multiple treatments
            - Factorial designs
            - Long model with the interaction
          Power and MDE
            > The probability of detecting an effect of a given size, and the smallest effect a design can detect.
            @ UNIBO/Field experiments/Pages/05. Power and design
            - MDE = (t α/2 + t 1−κ) · SE(β̂)
            - Falls with N, rises with outcome variance
            - Clustering, noncompliance and attrition raise it
        Noncompliance
          > Not everyone assigned to treatment takes it, and some controls get it.
          @ UNIBO/Field experiments/Pages/06. Noncompliance
          Intention to treat
            > The effect of being assigned, whatever people then do. Always identified by the randomization.
            ~ 2SLS
            - ITT: effect of assignment Z on Y
            - ITT_D: effect of Z on take-up
          LATE
            > The average effect for those who take the treatment only because they were assigned to it.
            ~ LATE and heterogeneous effects
            ~ Fuzzy
            - LATE = ITT / ITT_D
            - Effect on compliers only
          Excludability
            > Assignment must have no effect on the outcome other than through treatment.
            ~ Relevance and exclusion
            - Z affects Y only through D
          Monotonicity
            > Nobody does the opposite of what they are assigned.
            - No defiers
          One- and two-sided
            > Whether only the treatment group can deviate from assignment, or both groups can.
            ~ Partially fuzzy
            - One-sided: compliers and never-takers, LATE = ATT
            - Two-sided: adds always-takers and defiers
          Encouragement design
            > When treatment cannot be imposed or denied, we randomize a nudge towards it.
            ~ Instrumental variables
            - Randomize an incentive to take up, not the treatment
        Interference
          > The treatment of some units affects others.
          @ UNIBO/Field experiments/Pages/07. Interference
          Spillovers
            > Effects of the programme on people who did not receive it.
            - SUTVA fails
            - Deworming, Progresa, job-search displacement
          Three estimands
            > The total, the direct and the indirect effect of a programme, and how they add up.
            - TATE = E[Y(1,1) − Y(0,0)]
            - NATE = E[Y(1,1) − Y(1,0)]
            - IATE = E[Y(1,0) − Y(0,0)]
            - TATE = NATE + IATE
          Double randomization
            > Randomizing first how much of each area is treated, then who.
            - First areas (and intensity), then individuals
            - Separates direct and indirect effects
      Selection on observables
        > Methods that assume all relevant differences between treated and untreated are in the data.
        @ Concepts/Econometrics topics/04. Selection on observables and the propensity score
        Unconfoundedness
          > Among units with the same observed characteristics, who gets treated is as good as random.
          - (Y(0), Y(1)) ⊥ D | X
          - Plus common support
        Propensity score
          > The probability of being treated given the covariates. Comparing units with the same score removes the bias from observables.
          ~ Double machine learning
          - p(X) = P(D = 1 | X)
          - Conditioning on p(X) is enough: solves dimensionality
          - Logit or probit, then balance checks
        Matching estimators
          > Each treated unit is compared with untreated units that look like it.
          @ Concepts/Econometrics topics/05. Propensity score matching estimators
          Stratification
            > Units are grouped into intervals of the propensity score and compared within each.
            ~ Blocking
            - Blocks of the score, average the within-block differences
          Nearest neighbour
            > Each treated unit is paired with the control whose score is closest.
            ~ K-nearest neighbours
            - Closest control for each treated unit
          Radius
            > Each treated unit is compared with all controls whose score lies within a set distance.
            - All controls within a caliper
          Kernel
            > Every control contributes to the comparison, with more weight the closer its score.
            - Weighted average of all controls
        Sensitivity
          > How much the conclusions depend on choices and on the untestable assumption.
          @ Concepts/Econometrics topics/05. Propensity score matching estimators
          - Results move with the score specification
          - Nothing protects against unobservables
      Instrumental variables
        > A variable that moves the treatment but affects the outcome in no other way lets us isolate causal variation.
        @ UNIBO/Econometric methods for policy evaluation/Pages/04. Instrumental variables
        Relevance and exclusion
          > The two requirements for an instrument: it must shift the treatment, and it must matter for the outcome only through it.
          - Relevance: Cov(z, x) ≠ 0, testable
          - Exclusion: Cov(z, u) = 0, not testable
        2SLS
          > The standard IV estimator. We keep only the part of the regressor explained by the instrument and use that.
          - First stage: x on z
          - Reduced form: y on z
          - β IV = reduced form / first stage
        LATE and heterogeneous effects
          > When effects differ across people, IV recovers the effect only for those whose treatment responds to the instrument.
          @ UNIBO/Econometric methods for policy evaluation/Pages/04.5 Heterogenous treatment effects
          - Compliers, always-takers, never-takers, defiers
          - IV gives the effect on compliers
          - Limits external validity
        Control functions
          > Instead of replacing the endogenous regressor, we add a term that absorbs the part of the error correlated with it.
          @ Concepts/Econometrics topics/02. Control functions
          - Add a term for the selection part of the error as a regressor
          - More structure than IV, more efficiency if it holds
        Quasi-randomization
          > Using observational settings where some source of variation in treatment is plausibly unrelated to everything else.
          @ UNIBO/Econometric methods for policy evaluation/Pages/02 & 03. Causality and quasi-randomization
          - As-good-as-random variation in observational data
      Regression discontinuity
        > Treatment is assigned by a cutoff on a score. Units just either side are comparable.
        @ UNIBO/Econometric methods for policy evaluation/Pages/05. Regression discontinuity design (RDD)
        Sharp
          > Everyone above the cutoff is treated and nobody below.
          - Treatment jumps from 0 to 1 at the cutoff
          - Effect = jump in E[Y|S] at the cutoff
          - Local to the threshold
        Fuzzy
          > Crossing the cutoff raises the chance of treatment without determining it.
          ~ 2SLS
          - The probability of treatment jumps
          - Jump in Y / jump in D: a local IV
        Partially fuzzy
          > Only those above the cutoff are eligible, and some of them decline.
          @ Concepts/Econometrics topics/03. RDD identification and partially fuzzy designs
          - Eligible above the cutoff may opt out
          - Nobody below can participate
          - Gives the effect on participants at the threshold
        Non-parametric estimation
          > Using only observations close to the cutoff, with a flexible fit on each side.
          - Local regression inside a bandwidth
          - Bandwidth trades bias for variance
        Validity checks
          > Evidence that units could not sort around the cutoff and that nothing else changes there.
          - Covariate balance at the cutoff
          - Placebo tests
          - No self-selection around the threshold
          - Robust to functional form
      Difference-in-differences
        > Compare the change over time in a treated group with the change in an untreated one.
        @ UNIBO/Econometric methods for policy evaluation/Pages/06. Difference-in-differences (DiD)
        2×2
          > The basic case: two groups, two periods. The control group's change stands in for what the treated would have done.
          - (ȳ T,post − ȳ T,pre) − (ȳ C,post − ȳ C,pre)
          - Identifies the ATT
        Parallel trends
          > Without treatment, the two groups would have followed the same path.
          - Untreated outcomes would have moved alike
          - Pre-trends can be tested, the assumption cannot
        Regression DiD
          > The same comparison as a regression, which extends to more groups, more periods and controls.
          - Treat × Post with group and time effects
          - Generalises to many groups and periods
        Event studies
          > Separate effects for each period before and after treatment.
          - Leads test pre-trends
          - Lags trace the dynamics
        Staggered adoption
          > Different units start treatment at different times.
          @ Concepts/Econometrics topics/06. Modern difference-in-differences and synthetic control
          - Units treated at different dates
          - Building block: ATT(g, t) by cohort and period
        Why TWFE fails
          > With staggered timing and effects that vary, the standard two-way fixed effects regression makes comparisons that can give the wrong sign.
          @ Concepts/Econometrics topics/06. Modern difference-in-differences and synthetic control
          - Already-treated units serve as controls
          - Negative weights with heterogeneous effects
        Robust estimators
          > The recent estimators that use only clean comparisons with not-yet or never treated units.
          ~ DML with DiD
          @ Concepts/Econometrics topics/06. Modern difference-in-differences and synthetic control
          - Callaway and Sant'Anna
          - Sun and Abraham
          - Imputation (Borusyak, Jaravel, Spiess)
          - de Chaisemartin and D'Haultfœuille
          - Stacked
        Doubtful parallel trends
          > Instead of assuming parallel trends exactly, we ask how large a violation would overturn the result.
          @ Concepts/Econometrics topics/06. Modern difference-in-differences and synthetic control
          - Rambachan and Roth: bound the violation
          - Report the breakdown value M̄
      Synthetic control
        > For a single treated unit, the comparison is a weighted combination of untreated units.
        @ UNIBO/Econometric methods for policy evaluation/Pages/07. Synthetic control method (SCM)
        Weights and model
          > The weights are chosen so that the combination tracks the treated unit before treatment.
          ~ Matching estimators
          - Weighted average of donor units
          - Weights ≥ 0, summing to 1
          - Chosen to match the pre-treatment path
        Goodness of fit
          > How closely the synthetic unit follows the treated one before treatment. A poor fit undermines the whole exercise.
          - Pre-treatment RMSPE
        Placebo inference
          > We pretend each untreated unit was treated and see whether the real effect stands out.
          ~ Randomization inference
          - Assign the treatment to each donor in turn
          - Rank the post / pre RMSPE ratios
        Synthetic DiD
          > A hybrid that reweights both units and periods and then takes a difference-in-differences.
          @ Concepts/Econometrics topics/06. Modern difference-in-differences and synthetic control
          - Unit and time weights inside a DiD
      Bunching
        > Using the excess of people located exactly at a tax threshold to measure how they respond to incentives.
        @ Concepts/Econometrics topics/07. Bunching and sufficient statistics
        Kinks
          > A point where the marginal tax rate jumps. People who would have been just above move to it.
          - Change in the marginal rate
          - Excess mass at the kink gives the elasticity
        Notches
          > A point where the tax bill itself jumps. Being just above is worse than being at it, so a hole appears.
          - Jump in the average rate
          - Excess mass below, missing mass above
        Frictions
          > Real-world obstacles to adjusting. They make observed bunching understate the true response.
          - Adjustment costs and inattention mute bunching
        Estimation
          > How the amount of bunching is measured from the observed distribution.
          - Polynomial counterfactual density, bunching window excluded
          - Excess mass b
        Sufficient statistics
          > An approach that expresses the welfare effect of a policy in terms of a few estimable responses.
          - Welfare effects from a few elasticities
          - No full structural model
          - Income taxation, social insurance
      Causal machine learning
        > Using prediction algorithms inside causal estimation without letting their errors contaminate the result.
        @ Concepts/Econometrics topics/08. Causal machine learning
        @ UNIBO/Machine learning/Pages/11. Applications and causal ML
        Double lasso
          > Lasso selects controls twice, as predictors of the outcome and of the treatment, so no important confounder is dropped.
          ~ Lasso
          - Lasso for the outcome and for the treatment
          - Keep the union of the selected controls
        Neyman orthogonality
          > A property of the estimating equation that makes the result robust to imperfect machine-learning predictions.
          - Score insensitive to small errors in the nuisance functions
        Double machine learning
          > The general recipe: predict outcome and treatment flexibly, on separate folds, and estimate the effect from what is left.
          - Residualise Y and D with ML, with cross-fitting
          - Regress residual on residual
          - Partially linear model, or the doubly robust score for the ATE
        Heterogeneous effects
          > Estimating how the treatment effect varies with observed characteristics.
          ~ Treatment heterogeneity
          ~ Random forests
          - CATE: τ(x)
          - Causal forests
        Meta-learners
          > Generic recipes that turn any prediction algorithm into an estimator of individual-level effects.
          - S, T, X, DR and R learners
          - Chosen by out-of-sample loss
        Sensitivity
          > How strong an unobserved confounder would have to be to explain the estimate away.
          ~ Selection on observables / Sensitivity
          - How strong must a hidden confounder be
        DML with DiD
          > Combining flexible covariate adjustment with a difference-in-differences design.
          - Doubly robust DiD with ML nuisances
    Machine learning
      > Methods built to predict well on new data. The course follows the statistical-learning textbook.
      @ UNIBO/Machine learning/Machine learning course page
      Foundations
        > What it means to learn a relation from data and how we judge the result.
        @ UNIBO/Machine learning/Pages/01. Introduction to statistical learning
        Prediction vs inference
          > Two different goals. For prediction only accuracy matters; for inference we need to understand the relation.
          ~ Prediction vs causal inference
          - Prediction: accuracy of ŷ, f as a black box
          - Inference: how x moves y
        Quality of fit
          > Performance must be judged on data the model has not seen.
          - Training vs test MSE
          - Training MSE always falls with flexibility
        Bias-variance trade-off
          > Flexible models follow the data closely but change a lot from sample to sample. The best model balances the two.
          ~ Tuning parameter
          - Test MSE = variance + bias² + irreducible error
          - U-shape in flexibility
        Bayes classifier
          > The ideal classifier that knows the true probabilities. Every real method tries to approximate it.
          - Assign the most probable class given x
          - Bayes error rate: the floor
      Regression and classification
        > The baseline methods for predicting a number or a category.
        @ UNIBO/Machine learning/Pages/02. Regression and classification
        Linear regression
          > The starting point for prediction. Often hard to beat when data are few or noisy.
          ~ Multiple regression
          - The benchmark: interpretable, low variance
        K-nearest neighbours
          > Predict using the observations that are closest. No model is assumed, but it degrades quickly with many predictors.
          - Average or vote of the K nearest points
          - Small K: low bias, high variance
        Logistic regression
          > The standard linear method for a two-class outcome.
          - Log-odds linear in x
        Multinomial logistic
          > Logistic regression extended to more than two classes.
          - More than two classes
        Assessing a classifier
          > Overall accuracy hides the kinds of error. We look at each type and at how they trade off as the threshold moves.
          - Confusion matrix: sensitivity, specificity
          - ROC curve and AUC
      Resampling
        > Reusing the sample to estimate test error and uncertainty.
        @ UNIBO/Machine learning/Pages/03. Resampling methods
        Validation set
          > Hold out part of the data to test on. Simple, but the answer depends on the split.
          - One random split
          - Variable, overestimates the test error
        LOOCV
          > Each observation in turn serves as the test set.
          - n fits, each leaving one observation out
        k-fold cross-validation
          > The data are split into k parts and each serves once as test set. The standard way to estimate test error.
          ~ Tuning parameter
          ~ Pruning
          ~ Double machine learning
          - k = 5 or 10
          - Compromise between bias and variance
        Bootstrap
          > Drawing repeated samples from the data to see how much an estimate varies.
          ~ Bagging
          - Resample with replacement
          - SE of any statistic
      Subset selection
        > Choosing which predictors to keep in a linear model.
        @ UNIBO/Machine learning/Pages/04. Subset selection
        Best subset
          > Fit every possible combination of predictors and keep the best of each size.
          - All 2ᵖ models
          - Infeasible for large p
        Stepwise
          > Add or remove one predictor at a time. Much cheaper than best subset, not guaranteed to find the best model.
          - Forward, backward, hybrid
        Cp, AIC, BIC
          > Criteria that estimate test error from training error by penalising the number of predictors.
          - Adjust the training error for model size
          - BIC penalises more
      Shrinkage
        > Keep all predictors but pull their coefficients towards zero.
        @ UNIBO/Machine learning/Pages/05. Shrinkage methods
        Ridge
          > Shrinks all coefficients smoothly. Helps most when many predictors each matter a little.
          - Penalty λ·Σβ²
          - Shrinks, never exactly to zero
          - Standardise the predictors first
        Lasso
          > Shrinks and selects at the same time. Helps most when only a few predictors matter.
          ~ Best subset
          - Penalty λ·Σ|β|
          - Sets some coefficients to zero: selection
        Tuning parameter
          > The strength of the penalty, which governs the bias-variance trade-off.
          - λ chosen by cross-validation
      Dimension reduction
        > Replace many predictors with a few combinations of them.
        @ UNIBO/Machine learning/Pages/06. Dimension reduction and high dimensions
        Principal components
          > The combinations of the predictors that capture most of their variation.
          ~ PCA
          - Directions of largest variance
        Principal components regression
          > Regress the outcome on a few principal components instead of on all predictors.
          - Regress y on the first M components
          - Components built without y
        Partial least squares
          > Like principal components regression, but the combinations are chosen to be related to the outcome.
          - Components built using y
        High dimensions
          > When predictors outnumber observations, classical methods overfit completely.
          - p > n: perfect training fit, useless
          - Read results with care
      Beyond linearity
        > Ways to let the relation between a predictor and the outcome bend.
        @ UNIBO/Machine learning/Pages/07. Moving beyond linearity
        Polynomials
          > The simplest extension. Flexible, but badly behaved at the edges of the data.
          - Powers of x as regressors
        Step functions
          > A piecewise-constant fit. It imposes no shape but misses trends within bins.
          - Cut x into bins, a constant in each
        Regression splines
          > Polynomials fitted on separate intervals and joined so that the curve is smooth.
          - Piecewise polynomials, smooth at the knots
        Smoothing splines
          > A curve chosen to fit the data closely while staying smooth, with one parameter controlling the balance.
          - Penalty on roughness
          - Effective degrees of freedom
        Local regression
          > A separate weighted fit at each point, using only nearby observations.
          - Weighted fit around each point
        Generalized additive models
          > Each predictor gets its own flexible curve and the curves are added. Flexible and still readable.
          - Sum of smooth functions, one per predictor
      Tree-based methods
        > Methods that split the predictor space into regions, alone or combined in large numbers.
        @ UNIBO/Machine learning/Pages/08. Tree-based methods
        Regression and classification trees
          > The data are split repeatedly on one variable at a time. Easy to read, unstable by themselves.
          - Recursive binary splitting
          - Predict the region mean or majority class
        Pruning
          > A full tree overfits. We cut it back to the size that predicts best.
          - Grow a large tree, then cost-complexity pruning
          - α by cross-validation
        Bagging
          > Many trees fitted on resampled data and averaged.
          - Average trees over bootstrap samples
          - Averaging reduces variance
        Random forests
          > Bagging with a twist: each split may use only a random few predictors, so the trees differ more.
          - Random subset of predictors at each split
          - Decorrelates the trees
        Boosting
          > Small trees added one after another, each correcting the errors of the current model.
          - Trees grown in sequence on the residuals
          - Tuning: number of trees, shrinkage, depth
        OOB error and variable importance
          > Two by-products of bagging: a free estimate of test error, and a ranking of predictors.
          - Out-of-bag observations as a test set
          - Importance: total drop in RSS or Gini
      Deep learning
        > Neural networks with many layers, for images, text and other complex inputs.
        @ UNIBO/Machine learning/Pages/09. Deep learning
        Neural networks
          > Models that build new features as non-linear combinations of the inputs, layer after layer.
          - Hidden units: activations of linear combinations
          - Single layer, then multilayer
        Activation functions
          > The non-linear transformation applied in each unit. Without it the network would be a linear model.
          - ReLU, sigmoid
        Softmax and cross-entropy
          > How a network outputs class probabilities and how its errors are scored.
          - Class probabilities at the output
        Convolutional networks
          > Networks that look for local patterns anywhere in an image and combine them.
          - Convolution filters plus pooling
          - Images
        Recurrent networks
          > Networks that process a sequence in order and carry information forward.
          - Sequences: text, time series
        Word embeddings
          > A representation of words in which similar words are close to each other.
          ~ New data
          - Words as dense vectors
        Fitting
          > How the weights are found, and how overfitting is kept under control.
          - Gradient descent with backpropagation
          - SGD, dropout, regularisation
      Unsupervised learning
        > Finding structure in data when there is no outcome to predict.
        @ UNIBO/Machine learning/Pages/10. Unsupervised learning
        PCA
          > A few new variables that summarise most of the variation in many. Used to visualise and to compress.
          - Loadings, scores, biplot
          - Proportion of variance explained
          - Scale the variables first
        Matrix completion
          > Filling the missing cells of a data matrix by exploiting its low-dimensional structure.
          - Fill missing entries with a low-rank fit
          - Recommender systems
        K-means
          > Splits observations into a chosen number of groups so that members of a group are close.
          - Minimise within-cluster variation
          - K fixed in advance
          - Local optima: several starts
        Hierarchical clustering
          > Builds a tree of nested groups, so the number of clusters need not be fixed in advance.
          - Dendrogram, cut at a height
          - Linkage: complete, average, single
      ML in economics
        > Where prediction methods are useful to economists.
        @ UNIBO/Machine learning/Pages/11. Applications and causal ML
        Prediction policy problems
          > Decisions where what is needed is a good forecast, such as whom to inspect or whom to release.
          - Decisions that hinge on a prediction, not a causal effect
        New data
          > Machine learning turns unstructured sources into variables economists can use.
          - Text, satellite images, phone metadata
        Testing theories
          > Machine learning shows how much of the predictable variation a theory captures.
          - Compare a theory's fit with an ML benchmark
        Prediction vs causal inference
          > Predicting an outcome and estimating an effect are different tasks. The first can serve the second.
          ~ Causal machine learning
          - ŷ problems vs β̂ problems
          - Prediction in the service of estimation
    Software
      > Where the methods are implemented in the vault.
      Stata
        > The Stata cookbook: one page per method, syntax first, all code run on the vault datasets.
        @ Concepts/Stata hub
        Basics
          > Cookbook page on loading, inspecting and preparing data.
          @ Concepts/Stata/01. Stata basics
        Regression
          > Cookbook page on OLS, robust standard errors and tests.

        Binary response

        Panel data

        Experiments
          > Cookbook page on analysing randomized trials.

        Power
          > Cookbook page on power and sample size calculations.
          ~ Power and MDE

        IV
          > Cookbook page on instrumental variables estimation.
          ~ Instrumental variables

        DiD
          > Cookbook page on difference-in-differences, including the recent estimators.
          ~ Difference-in-differences
          @ Concepts/Stata/08. DiD in Stata
        RDD
          > Cookbook page on regression discontinuity.
          ~ Regression discontinuity
          @ Concepts/Stata/09. RDD in Stata
        Synthetic control
          > Cookbook page on the synthetic control method.
          ~ Causal inference / Synthetic control
          @ Concepts/Stata/10. Synthetic control in Stata
        Selection and matching
          > Cookbook page on selection models and propensity score matching.
          ~ Selection models
          ~ Matching estimators
          @ Concepts/Stata/11. Selection and matching in Stata
      R

        ~ Econometrics / Linear regression

  Economics

    Microeconomic theory
      > The theory beyond the intermediate course: general equilibrium, uncertainty, information and the design of rules.

        > All markets clear at once. The questions are existence, uniqueness and stability of the equilibrium, and the welfare theorems in full generality.
        = D5
        @ UNIBO/Foundations (PE1)/Pages/01. Competition and efficiency
